<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Squishy Mart 💗</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  font-family:Arial,sans-serif;

  background:#ffe4f1;

  color:#333;

}

button{

  font-family:inherit;

  cursor:pointer;

}

header{

  background:#ff8fc4;

  padding:14px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  position:sticky;

  top:0;

  z-index:50;

  box-shadow:0 3px 12px rgba(0,0,0,.12);

}

.logo{

  font-size:24px;

  font-weight:bold;

  color:white;

}

.header-buttons{

  display:flex;

  gap:8px;

}

.header-btn{

  border:0;

  border-radius:20px;

  padding:10px 13px;

  background:white;

  color:#ff5fae;

  font-weight:bold;

}

.hero{

  text-align:center;

  padding:30px 15px 18px;

}

.hero h1{

  color:#ff4fa7;

  font-size:36px;

  margin:5px 0;

}

.hero p{

  margin:8px;

}

.country-display{

  color:#777;

  font-size:14px;

}

.shop{

  max-width:1100px;

  margin:auto;

  padding:15px;

}

.products{

  display:grid;

  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));

  gap:18px;

}

.product{

  background:white;

  border-radius:22px;

  padding:15px;

  text-align:center;

  box-shadow:0 5px 15px rgba(0,0,0,.1);

}

.product img{

  width:100%;

  height:160px;

  object-fit:contain;

  border-radius:15px;

}

.emoji-image{

  height:160px;

  display:flex;

  justify-content:center;

  align-items:center;

  font-size:90px;

}

.product h3{

  margin:10px 0 5px;

  color:#ff55aa;

}

.price{

  font-weight:bold;

  font-size:19px;

  margin:7px;

}

.view-btn{

  width:100%;

  border:0;

  background:#ffe0ef;

  color:#ff4fa7;

  border-radius:18px;

  padding:10px;

  font-weight:bold;

  margin-top:7px;

}

.add-btn{

  border:0;

  background:#ff69b4;

  color:white;

  border-radius:20px;

  padding:10px 17px;

  font-weight:bold;

  margin-top:7px;

}

/* COUNTRY SCREEN */

.country-screen{

  position:fixed;

  inset:0;

  background:linear-gradient(135deg,#ffb6da,#fff0f8);

  z-index:1000;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:20px;

}

.country-box{

  background:white;

  width:min(500px,100%);

  border-radius:30px;

  padding:30px 20px;

  text-align:center;

  box-shadow:0 10px 35px rgba(0,0,0,.15);

}

.country-box h1{

  color:#ff4fa7;

  margin-top:0;

}

.country-box p{

  color:#777;

}

.country-options{

  display:grid;

  gap:10px;

  margin-top:20px;

}

.country-option{

  border:2px solid #ffd0e6;

  background:#fff7fb;

  padding:13px;

  border-radius:18px;

  font-size:16px;

  font-weight:bold;

  color:#ff4fa7;

}

.country-option.selected{

  background:#ff69b4;

  color:white;

  border-color:#ff69b4;

}

.other-country{

  display:none;

  margin-top:15px;

}

.other-country input{

  width:100%;

  padding:13px;

  border:2px solid #ffc5df;

  border-radius:15px;

  font-size:16px;

}

.next-btn{

  width:100%;

  margin-top:20px;

  border:0;

  border-radius:20px;

  padding:14px;

  background:#ff69b4;

  color:white;

  font-size:18px;

  font-weight:bold;

}

.next-btn:disabled{

  background:#ddd;

}

.country-error{

  color:#e74c3c;

  font-size:14px;

  margin-top:10px;

}

/* PRODUCT POPUP */

.product-screen{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  z-index:400;

  display:none;

  justify-content:center;

  align-items:center;

  padding:20px;

}

.product-box{

  background:white;

  width:min(430px,100%);

  max-height:90vh;

  overflow:auto;

  border-radius:28px;

  padding:22px;

  text-align:center;

}

.product-box img{

  width:100%;

  height:220px;

  object-fit:contain;

}

.product-box h2{

  color:#ff4fa7;

}

.product-box .big-emoji{

  font-size:120px;

}

.color-title{

  font-weight:bold;

  color:#ff4fa7;

  margin-top:15px;

}

.colors{

  display:flex;

  flex-wrap:wrap;

  justify-content:center;

  gap:8px;

  margin:10px 0;

}

.color-btn{

  border:2px solid #ddd;

  background:white;

  border-radius:18px;

  padding:9px 14px;

  font-size:13px;

}

.color-btn.selected{

  border-color:#ff4fa7;

  background:#ffe0ef;

  color:#ff4fa7;

  font-weight:bold;

}

.popup-add{

  width:100%;

  border:0;

  background:#ff69b4;

  color:white;

  border-radius:20px;

  padding:14px;

  font-size:17px;

  font-weight:bold;

  margin-top:12px;

}

.popup-close{

  width:100%;

  border:0;

  background:#eee;

  border-radius:20px;

  padding:12px;

  margin-top:8px;

}

/* CART */

.cart-panel{

  position:fixed;

  right:-420px;

  top:0;

  width:min(420px,100%);

  height:100%;

  background:white;

  z-index:500;

  box-shadow:-5px 0 20px rgba(0,0,0,.2);

  transition:right .3s ease;

  padding:20px;

  overflow-y:auto;

}

.cart-panel.open{

  right:0;

}

.cart-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.close-cart{

  border:0;

  background:#ffe1ee;

  color:#ff4fa7;

  border-radius:50%;

  width:38px;

  height:38px;

  font-size:20px;

}

.cart-item{

  border-bottom:1px solid #eee;

  padding:15px 0;

}

.cart-item-title{

  font-weight:bold;

  color:#ff4fa7;

}

.cart-item-controls{

  display:flex;

  align-items:center;

  gap:8px;

  margin-top:8px;

  flex-wrap:wrap;

}

.qty-btn{

  border:0;

  background:#ffd4e8;

  color:#ff4fa7;

  width:30px;

  height:30px;

  border-radius:10px;

  font-weight:bold;

}

.remove-btn{

  border:0;

  background:#ffdddd;

  color:#d44;

  border-radius:10px;

  padding:6px 9px;

}

.cart-total{

  font-size:23px;

  font-weight:bold;

  color:#ff4fa7;

  margin:20px 0;

}

.email-btn,

.clear-btn{

  width:100%;

  border:0;

  border-radius:20px;

  padding:14px;

  font-weight:bold;

}

.email-btn{

  background:#ff69b4;

  color:white;

  font-size:17px;

}

.clear-btn{

  margin-top:8px;

  background:#eee;

}

.empty-cart{

  text-align:center;

  color:#888;

  padding:30px 0;

}

/* ADDRESS */

.address-screen{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  z-index:600;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

}

.address-box{

  background:white;

  width:min(450px,100%);

  border-radius:25px;

  padding:25px;

}

.address-box h2{

  color:#ff4fa7;

  text-align:center;

  margin-top:0;

}

.address-box p{

  text-align:center;

  color:#777;

}

.address-box textarea{

  width:100%;

  min-height:130px;

  padding:14px;

  border:2px solid #ffc5df;

  border-radius:15px;

  font-family:Arial;

  font-size:16px;

  resize:vertical;

}

.address-box button{

  width:100%;

  border:0;

  border-radius:20px;

  padding:14px;

  margin-top:10px;

  font-weight:bold;

  font-size:16px;

}

#continueOrderBtn{

  background:#ff69b4;

  color:white;

}

#cancelAddressBtn{

  background:#eee;

  color:#555;

}

.address-error{

  color:#e74c3c;

  text-align:center;

  margin-top:8px;

}

@media(max-width:500px){

  .logo{

    font-size:19px;

  }

  .header-btn{

    padding:8px 10px;

    font-size:12px;

  }

  .hero h1{

    font-size:30px;

  }

  .products{

    grid-template-columns:repeat(2,1fr);

    gap:10px;

  }

  .product{

    padding:10px;

  }

  .product img,

  .emoji-image{

    height:125px;

  }

  .emoji-image{

    font-size:65px;

  }

  .product h3{

    font-size:15px;

  }

}

</style>

</head>

<body>

<!-- COUNTRY / CURRENCY IS THE FIRST THING SHOWN -->

<div class="country-screen" id="countryScreen">

  <div class="country-box">

    <h1>🌎 Choose Your Country</h1>

    <p>

      Choose your country first so we can show prices in your currency.

    </p>

    <div class="country-options">

      <button class="country-option" data-country="USA">

        🇺🇸 USA

      </button>

      <button class="country-option" data-country="Singapore">

        🇸🇬 Singapore

      </button>

      <button class="country-option" data-country="Thailand">

        🇹🇭 Thailand

      </button>

      <button class="country-option" data-country="UK">

        🇬🇧 UK

      </button>

      <button class="country-option" data-country="Other">

        🌎 Other Country

      </button>

    </div>

    <div class="other-country" id="otherCountryBox">

      <input

        id="otherCountryInput"

        type="text"

</div>

<header>

  <div class="header-buttons">

      class="header-btn"

      id="countryBtn">

      🌎 Country

    </button>

    <button

      class="header-btn"

      id="cartBtn">

      🛒 Cart (<span id="cartCount">0</span>)

    </button>

  </div>

</header>

<section class="hero">

  <h1>

    Welcome to Squishy Mart! 🧸

  </h1>

  <p>

    Pick your favourite squishy! 💕

  </p>

  <div

  </div>

</section>

<main class="shop">

  <div

    id="products"

    class="products">

  </div>

</main>

<!-- PRODUCT POPUP -->

<div

  class="product-screen"

  id="productScreen">

  <div class="product-box">

    <div id="popupPicture"></div>

    <h2 id="popupName"></h2>

    <div

      class="price"

      id="popupPrice">

    </div>

    <div

      class="color-title"

      id="colorTitle">

    </div>

    <div

      class="colors"

      id="popupColors">

    </div>

    <button

      class="popup-add"

      id="popupAdd">

      🛒 Add to Cart

    </button>

    <button

      class="popup-close"

      id="popupClose">

      CLOSE

    </button>

  </div>

</div>

<!-- CART -->

<div

  class="cart-panel"

  id="cartPanel">

  <div class="cart-header">

    <h2>

      🛒 Your Cart

    </h2>

    <button

      class="close-cart"

      id="closeCart">

      ×

    </button>

  </div>

  <div id="cartItems"></div>

  <div class="cart-total">

    Total:

  <button

    class="email-btn"

    📧 Order by Email

    Clear Cart

</div>

<!-- ADDRESS -->

<div

  class="address-screen"

  id="addressScreen">

  <div class="address-box">

    <h2>

      📦 Add Your Address

    </h2>

    <p>

      Enter your delivery address for your order.

    </p>

    <textarea

      id="addressInput"

      placeholder="House number, street, city, postal code, country">

    </textarea>

    <div

      id="addressError"

      class="address-error">

    </div>

    <button id="continueOrderBtn">

      CONTINUE TO PAYMENT →

    </button>

    </button>

</div>

<script>

const products = [

  {

    id:"slow-rise-butter",

    name:"Slow Rise Butter",

    price:6,

    image:"IMG_1103.jpeg"

  },

  {

    id:"vaseline-butter",

  },

  {

    price:6,

    colors:["Blue","Pink"]

  },

  {

    name:"Cheese",

    price:4,

    image:"IMG_1098.jpeg"

  },

  {

    id:"potato",

    name:"Potato",

    price:6,

    image:"IMG_1101.jpeg"

  },

  {

    id:"peach",

    name:"Peach",

    price:9,

    image:"IMG_1093.jpeg"

  },

  {

    id:"crunchy-toast",

    name:"Crunchy Toast",

    price:6,

    image:"IMG_1095.jpeg"

  },

  {

    id:"needoh-cloud",

    name:"Needoh Cloud",

    price:8,

    emoji:"☁️"

  },

  {

    id:"giant-strawberry",

    name:"Giant Strawberry",

    price:9,

    image:"IMG_1094.jpeg"

  },

  {

    id:"slushy-apple",

    name:"Slushy Apple",

    price:6,

    image:"IMG_1100.jpeg",

    colors:["Red","Green"]

  },

  {

    id:"duck",

    name:"Duck",

    price:6,

    image:"IMG_1090.jpeg",

    colors:["Pink","Blue","Orange","Purple"]

  },

  {

    id:"crunchy-soap",

    name:"Crunchy Soap",

    price:6,

    image:"IMG_1102.jpeg"

  },

  {

    id:"needoh",

    name:"Needoh",

    price:8,

    emoji:"🌈",

    colors:["Blue","Pink","Purple"]

  },

  {

    id:"needoh-jellyfish",

    name:"Needoh Jellyfish",

    price:8,

    emoji:"🪼",

    colors:["Blue","Pink","Purple"]

  },

  {

    id:"needoh-cake",

    name:"Needoh Cake",

    price:8,

    emoji:"🍰"

  },

  {

    id:"needoh-ice-cream",

    name:"Needoh Ice Cream",

    price:8,

    emoji:"🍦",

    colors:["Blue","Pink","Orange"]

  },

  {

    id:"bear",

    name:"Bear",

    price:3,

    image:"IMG_1092.jpeg",

    colors:["Pink","Blue","Orange","Purple"]

  }

];

const countryScreen =

  document.getElementById("countryScreen");

const nextBtn =

  document.getElementById("nextBtn");

const otherCountryBox =

  document.getElementById("otherCountryBox");

const otherCountryInput =

  document.getElementById("otherCountryInput");

const countryError =

  document.getElementById("countryError");

const countryDisplay =

  document.getElementById("countryDisplay");

const productsContainer =

  document.getElementById("products");

const cartPanel =

  document.getElementById("cartPanel");

const cartItems =

  document.getElementById("cartItems");

const cartTotal =

  document.getElementById("cartTotal");

const cartCount =

  document.getElementById("cartCount");

const addressScreen =

  document.getElementById("addressScreen");

const addressInput =

  document.getElementById("addressInput");

const addressError =

  document.getElementById("addressError");

const productScreen =

  document.getElementById("productScreen");

const popupPicture =

  document.getElementById("popupPicture");

const popupName =

  document.getElementById("popupName");

const popupPrice =

  document.getElementById("popupPrice");

const popupColors =

  document.getElementById("popupColors");

const colorTitle =

  document.getElementById("colorTitle");

const popupAdd =

  document.getElementById("popupAdd");

let selectedCountry="";

let currencyCode="USD";

let exchangeRate=1;

let cart=[];

let selectedProduct=null;

let selectedColor="";

try{

  cart=JSON.parse(

    localStorage.getItem("squishyCart") || "[]"

  );

  if(!Array.isArray(cart)){

    cart=[];

  }

}catch{

  cart=[];

}

const countryCurrencies={

  thailand:"THB",

  uk:"GBP",

  "united kingdom":"GBP",

  england:"GBP",

  japan:"JPY",

  "south korea":"KRW",

  korea:"KRW",

  china:"CNY",

  "hong kong":"HKD",

  taiwan:"TWD",

  malaysia:"MYR",

  indonesia:"IDR",

  philippines:"PHP",

  australia:"AUD",

  "new zealand":"NZD",

  canada:"CAD",

  india:"INR",

  vietnam:"VND",

  france:"EUR",

  germany:"EUR",

  italy:"EUR",

  spain:"EUR",

  netherlands:"EUR",

  belgium:"EUR",

  ireland:"EUR",

  portugal:"EUR",

  switzerland:"CHF",

  sweden:"SEK",

  norway:"NOK",

  denmark:"DKK",

  poland:"PLN",

  mexico:"MXN",

  brazil:"BRL",

  "south africa":"ZAR",

  "united arab emirates":"AED",

  uae:"AED",

  "saudi arabia":"SAR",

  qatar:"QAR",

  israel:"ILS",

  turkey:"TRY",

  russia:"RUB"

};

function saveCart(){

  localStorage.setItem(

    "squishyCart",

    JSON.stringify(cart)

  );

}

function formatMoney(usd){

  const amount =

    usd * exchangeRate;

  try{

    return new Intl.NumberFormat(

      undefined,

      {

        style:"currency",

        currency:currencyCode

      }

    ).format(amount);

  }catch{

    return currencyCode +

      " " +

      amount.toFixed(2);

  }

}

async function getExchangeRate(currency){

  if(

    currency==="USD" ||

    currency==="SGD"

  ){

    return 1;

  }

  const response =

    await fetch(

      "https://open.er-api.com/v6/latest/USD"

    );

  if(!response.ok){

    throw new Error(

      "Currency conversion is unavailable right now."

    );

  }

  const data =

    await response.json();

  if(

    !data.rates ||

    !data.rates[currency]

  ){

    throw new Error(

      "That currency is not available right now."

    );

  }

  return Number(

    data.rates[currency]

  );

}

async function findCurrencyForCountry(country){

  const clean =

    country

      .toLowerCase()

      .trim();

  if(countryCurrencies[clean]){

    return countryCurrencies[clean];

  }

  const response =

    await fetch(

      "https://restcountries.com/v3.1/name/" +

      encodeURIComponent(country) +

      "?fields=name,currencies"

    );

  if(!response.ok){

    throw new Error(

      "I couldn't find that country. Check the spelling."

    );

  }

  const data =

    await response.json();

  const currencies =

    data?.[0]?.currencies

      ? Object.keys(data[0].currencies)

      : [];

  if(!currencies.length){

    throw new Error(

      "I couldn't find that country's currency."

    );

  }

  return currencies[0];

}

/* COUNTRY CHOICE */

document

  .querySelectorAll(".country-option")

  .forEach(button=>{

    button.addEventListener(

      "click",

      ()=>{

        document

          .querySelectorAll(".country-option")

          .forEach(b=>

            b.classList.remove("selected")

          );

        button.classList.add("selected");

        selectedCountry =

          button.dataset.country;

        countryError.textContent="";

        otherCountryBox.style.display =

          selectedCountry==="Other"

            ? "block"

            : "none";

        nextBtn.disabled=false;

        if(selectedCountry==="Other"){

          otherCountryInput.focus();

        }

      }

    );

  });

nextBtn.addEventListener(

  "click",

  async()=>{

    countryError.textContent="";

    nextBtn.disabled=true;

    nextBtn.textContent="LOADING...";

    try{

      if(selectedCountry==="USA"){

        currencyCode="USD";

        exchangeRate=1;

      }

      else if(

        selectedCountry==="Singapore"

      ){

        currencyCode="SGD";

        exchangeRate=1;

      }

      else if(

        selectedCountry==="Thailand"

      ){

        currencyCode="THB";

        exchangeRate =

          await getExchangeRate("THB");

      }

      else if(

        selectedCountry==="UK"

      ){

        currencyCode="GBP";

        exchangeRate =

          await getExchangeRate("GBP");

      }

      else if(

        selectedCountry==="Other"

      ){

        const typed =

          otherCountryInput.value.trim();

        if(!typed){

          throw new Error(

            "Please type your country."

          );

        }

        currencyCode =

          await findCurrencyForCountry(

            typed

          );

        exchangeRate =

          await getExchangeRate(

            currencyCode

          );

        selectedCountry=typed;

      }

      localStorage.setItem(

        "squishyCountry",

        selectedCountry

      );

      localStorage.setItem(

        "squishyCurrency",

        currencyCode

      );

      localStorage.setItem(

        "squishyRate",

        String(exchangeRate)

      );

      countryScreen.style.display="none";

      countryDisplay.textContent =

        "🌎 " +

        selectedCountry +

        " • " +

        currencyCode;

      renderProducts();

      renderCart();

    }

    catch(error){

      console.error(error);

      countryError.textContent =

        error.message ||

        "Something went wrong.";

    }

    finally{

      nextBtn.disabled=false;

      nextBtn.textContent="NEXT →";

    }

  }

);

/* PRODUCTS */

function renderProducts(){

  productsContainer.innerHTML="";

  products.forEach(product=>{

    const card =

      document.createElement("div");

    card.className="product";

    let picture="";

    if(product.image){

      picture=`

        <img

          src="${product.image}"

          alt="${product.name}"

          onerror="

            this.style.display='none';

            this.nextElementSibling.style.display='flex';

          "

        >

        <div

          class="emoji-image"

          style="display:none">

          🩷

        </div>

      `;

    }

    else{

      picture=`

        <div class="emoji-image">

          ${product.emoji}

        </div>

      `;

    }

    card.innerHTML=`

      ${picture}

      <h3>

        ${product.name}

      </h3>

      <div class="price">

        ${formatMoney(product.price)}

      </div>

      <button

        type="button"

        class="view-btn"

        data-view="${product.id}">

        👀 Choose

      </button>

    `;

    productsContainer.appendChild(card);

  });

  document

    .querySelectorAll("[data-view]")

    .forEach(button=>{

      button.addEventListener(

        "click",

        ()=>{

          openProduct(

            button.dataset.view

          );

        }

      );

    });

}

/* PRODUCT COLOR CHOICE */

function openProduct(productId){

  const product =

    products.find(

      p=>p.id===productId

    );

  if(!product)return;

  selectedProduct=product;

  selectedColor="";

  popupName.textContent =

    product.name;

  popupPrice.textContent =

    formatMoney(product.price);

  if(product.image){

    popupPicture.innerHTML=`

      <img

        src="${product.image}"

        alt="${product.name}"

      >

    `;

  }

  else{

    popupPicture.innerHTML=`

      <div class="big-emoji">

        ${product.emoji}

      </div>

    `;

  }

  popupColors.innerHTML="";

  if(product.colors){

    colorTitle.textContent =

      "🎨 Choose a color";

    product.colors.forEach(color=>{

      const button =

        document.createElement("button");

      button.type="button";

      button.className="color-btn";

      button.textContent=color;

      button.addEventListener(

        "click",

        ()=>{

          selectedColor=color;

          document

            .querySelectorAll(

              "#popupColors .color-btn"

            )

            .forEach(

              b=>b.classList.remove("selected")

            );

          button.classList.add("selected");

        }

      );

      popupColors.appendChild(button);

    });

  }

  else{

    colorTitle.textContent="";

  }

  productScreen.style.display="flex";

}

popupAdd.addEventListener(

  "click",

  ()=>{

    if(!selectedProduct)return;

    if(

      selectedProduct.colors &&

      !selectedColor

    ){

      alert(

        "Please choose a color first! 🎨"

      );

      return;

    }

    const existing =

      cart.find(

        item=>

          item.productId===

          selectedProduct.id &&

          item.color===

          selectedColor

      );

    if(existing){

      existing.quantity++;

    }

    else{

      cart.push({

        productId:

          selectedProduct.id,

        color:

          selectedColor,

        quantity:1

      });

    }

    saveCart();

    renderCart();

    productScreen.style.display="none";

    cartPanel.classList.add("open");

  }

);

document

  .getElementById("popupClose")

  .addEventListener(

    "click",

    ()=>{

      productScreen.style.display="none";

    }

  );

/* CART */

function renderCart(){

  cartItems.innerHTML="";

  let total=0;

  let count=0;

  if(!cart.length){

    cartItems.innerHTML=

      '<div class="empty-cart">🛒 Your cart is empty.</div>';

  }

  cart.forEach(

    (item,index)=>{

      const product =

        products.find(

          p=>p.id===item.productId

        );

      if(!product)return;

      total +=

        product.price *

        item.quantity;

      count +=

        item.quantity;

      const div =

        document.createElement("div");

      div.className="cart-item";

      div.innerHTML=`

        <div class="cart-item-title">

          ${product.name}

        </div>

        ${

          item.color

            ? `<div>🎨 Color: ${item.color}</div>`

            : ""

        }

        <div>

          ${formatMoney(product.price)}

          each

        </div>

        <div class="cart-item-controls">

          <button

            class="qty-btn"

            data-minus="${index}">

            −

          </button>

          <strong>

            ${item.quantity}

          </strong>

          <button

            class="qty-btn"

            data-plus="${index}">

            +

          </button>

          <button

            class="remove-btn"

            data-remove="${index}">

            Remove

          </button>

        </div>

        <div>

          <strong>

            ${formatMoney(

              product.price *

              item.quantity

            )}

          </strong>

        </div>

      `;

      cartItems.appendChild(div);

    }

  );

  cartTotal.textContent =

    formatMoney(total);

  cartCount.textContent =

    count;

  document

    .querySelectorAll("[data-minus]")

    .forEach(button=>{

      button.addEventListener(

        "click",

        ()=>{

          const index =

            Number(button.dataset.minus);

          cart[index].quantity--;

          if(

            cart[index].quantity<=0

          ){

            cart.splice(index,1);

          }

          saveCart();

          renderCart();

        }

      );

    });

  document

    .querySelectorAll("[data-plus]")

    .forEach(button=>{

      button.addEventListener(

        "click",

        ()=>{

          const index =

            Number(button.dataset.plus);

          cart[index].quantity++;

          saveCart();

          renderCart();

        }

      );

    });

  document

    .querySelectorAll("[data-remove]")

    .forEach(button=>{

      button.addEventListener(

        "click",

        ()=>{

          cart.splice(

            Number(button.dataset.remove),

            1

          );

          saveCart();

          renderCart();

        }

      );

    });

}

/* CART BUTTONS */

document

  .getElementById("cartBtn")

  .addEventListener(

    "click",

    ()=>{

      cartPanel.classList.add("open");

    }

  );

document

  .getElementById("closeCart")

  .addEventListener(

    "click",

    ()=>{

      cartPanel.classList.remove("open");

    }

  );

document

  .getElementById("clearCart")

  .addEventListener(

    "click",

    ()=>{

      cart=[];

      saveCart();

      renderCart();

    }

  );

/* ADDRESS */

document

  .getElementById("emailOrder")

  .addEventListener(

    "click",

    ()=>{

      if(!cart.length){

        alert(

          "Your cart is empty!"

        );

        return;

      }

      addressInput.value="";

      addressError.textContent="";

      addressScreen.style.display="flex";

      addressInput.focus();

    }

  );

/* STRIPE CHECKOUT */

document

  .getElementById("continueOrderBtn")

  .addEventListener(

    "click",

    async()=>{

      const address =

        addressInput.value.trim();

      if(!address){

        addressError.textContent =

          "Please enter your address.";

        return;

      }

      const button =

        document.getElementById(

          "continueOrderBtn"

        );

      button.disabled=true;

      button.textContent =

        "STARTING PAYMENT...";

      addressError.textContent="";

      try{

        const response =

          await fetch(

            "https://squishymart.vercel.app/api/create-checkout-session",

            {

              method:"POST",

              headers:{

                "Content-Type":

                  "application/json"

              },

              body:JSON.stringify({

                country:

                  selectedCountry,

                address:

                  address,

                cart:

                  cart

              })

            }

          );

        const data =

          await response

            .json()

            .catch(

              ()=>({})

            );

        if(

          !response.ok ||

          !data.url

        ){

          throw new Error(

            data.error ||

            "Payment could not be started."

          );

        }

        window.location.href =

          data.url;

      }

      catch(error){

        console.error(error);

        addressError.textContent =

          error.message ||

          "Payment could not be started.";

        button.disabled=false;

        button.textContent =

          "CONTINUE TO PAYMENT →";

      }

    }

  );

document

  .getElementById("cancelAddressBtn")

  .addEventListener(

    "click",

    ()=>{

      addressScreen.style.display="none";

    }

  );

/* COUNTRY BUTTON */

document

  .getElementById("countryBtn")

  .addEventListener(

    "click",

    ()=>{

      countryScreen.style.display="flex";

    }

  );

/* SAVED COUNTRY */

function loadSavedCountry(){

  const country =

    localStorage.getItem(

      "squishyCountry"

    );

  const currency =

    localStorage.getItem(

      "squishyCurrency"

    );

  const rate =

    localStorage.getItem(

      "squishyRate"

    );

  /*

    If there is no saved country,

    the country screen stays in front.

  */

  if(

    country &&

    currency &&

    rate &&

    Number.isFinite(Number(rate))

  ){

    selectedCountry=country;

    currencyCode=currency;

    exchangeRate=

      Number(rate);

    countryDisplay.textContent =

      "🌎 " +

      selectedCountry +

      " • " +

      currencyCode;

    countryScreen.style.display=

      "none";

  }

  else{

    countryScreen.style.display=

      "flex";

  }

}

loadSavedCountry();

renderProducts();

renderCart();
