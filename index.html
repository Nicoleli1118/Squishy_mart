<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Squishy Mart 💗</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  font-family:Arial,sans-serif;

  background:#ffe4f1;

  color:#333;

}

header{

  background:#ff8fc4;

  padding:16px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  position:sticky;

  top:0;

  z-index:20;

}

header h1{

  margin:0;

  color:white;

  font-size:24px;

}

.headerButtons{

  display:flex;

  gap:8px;

}

button{

  border:0;

  border-radius:12px;

  padding:10px 14px;

  cursor:pointer;

  font-weight:bold;

}

.cartBtn,.countryBtn{

  background:white;

  color:#ff5fa2;

}

.hero{

  text-align:center;

  padding:30px 15px 20px;

}

.hero h2{

  color:#ff4f99;

  margin-bottom:8px;

}

.products{

  display:grid;

  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));

  gap:18px;

  padding:20px;

  max-width:1100px;

  margin:auto;

}

.card{

  background:white;

  border-radius:20px;

  padding:12px;

  box-shadow:0 4px 12px #00000012;

  text-align:center;

}

.cardImage{

  height:170px;

  border-radius:15px;

  background:#fff4fa;

  display:flex;

  justify-content:center;

  align-items:center;

  overflow:hidden;

  font-size:65px;

}

.cardImage img{

  width:100%;

  height:100%;

  object-fit:contain;

}

.card h3{

  font-size:17px;

  margin:12px 0 5px;

}

.price{

  color:#ff4f99;

  font-weight:bold;

  margin-bottom:10px;

}

.viewBtn{

  width:100%;

  background:#ff8fc4;

  color:white;

}

.modalOverlay{

  display:none;

  position:fixed;

  inset:0;

  background:#00000066;

  z-index:50;

  justify-content:center;

  align-items:center;

  padding:15px;

}

.modal{

  background:white;

  border-radius:20px;

  padding:20px;

  max-width:430px;

  width:100%;

  max-height:90vh;

  overflow:auto;

}

.close{

  float:right;

  background:#eee;

}

.colorButtons{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin:10px 0;

}

.colorBtn{

  background:#ffe0ef;

  color:#d9367b;

}

.colorBtn.selected{

  background:#ff72ad;

  color:white;

}

.addBtn,

.checkoutBtn{

  width:100%;

  background:#ff72ad;

  color:white;

  margin-top:10px;

}

.cartItem{

  display:flex;

  justify-content:space-between;

  gap:8px;

  align-items:center;

  padding:10px 0;

  border-bottom:1px solid #eee;

}

.qty{

  display:flex;

  align-items:center;

  gap:6px;

}

.qty button{

  background:#ffd4e7;

  padding:5px 9px;

}

.remove{

  background:#eee;

}

.total{

  font-size:20px;

  font-weight:bold;

  color:#ff4f99;

  margin-top:15px;

}

.countryScreen{

  position:fixed;

  inset:0;

  background:#ffe4f1;

  z-index:100;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:20px;

}

.countryBox{

  background:white;

  padding:25px;

  border-radius:22px;

  width:100%;

  max-width:400px;

  text-align:center;

}

.countryOption{

  display:block;

  width:100%;

  margin:9px 0;

  background:#ff8fc4;

  color:white;

}

.otherInput{

  display:none;

  width:100%;

  padding:12px;

  border:1px solid #ddd;

  border-radius:10px;

  margin-top:10px;

}

.addressInput{

  width:100%;

  padding:12px;

  margin:7px 0;

  border:1px solid #ddd;

  border-radius:10px;

}

@media(max-width:500px){

  .products{

    grid-template-columns:repeat(2,1fr);

    padding:10px;

    gap:10px;

  }

  .cardImage{

    height:130px;

  }

  header h1{

    font-size:19px;

  }

  header{

    padding:10px;

  }

}

</style>

</head>

<body>

<header>

<h1>Squishy Mart 💗</h1>

<div class="headerButtons">

<button class="countryBtn" onclick="openCountry()">

Country

</button>

<button class="cartBtn" onclick="openCart()">

Cart (<span id="cartCount">0</span>)

</button>

</div>

</header>

<section class="hero">

<h2>Welcome to Squishy Mart! 🧸</h2>

<p>Pick your favourite squishy! 💕</p>

<p id="currencyMessage">

Choose your country to see prices.

</p>

</section>

<div class="products" id="products"></div>

<!-- COUNTRY -->

<div class="countryScreen" id="countryScreen">

<div class="countryBox">

<h2>Choose Your Country 🌎</h2>

<p>

Prices will automatically use your country's currency.

</p>

<button class="countryOption"

onclick="chooseCountry('USA')">

🇺🇸 USA — USD

</button>

<button class="countryOption"

onclick="chooseCountry('Singapore')">

🇸🇬 Singapore — SGD

</button>

<button class="countryOption"

onclick="chooseCountry('Thailand')">

🇹🇭 Thailand — THB

</button>

<button class="countryOption"

onclick="chooseCountry('UK')">

🇬🇧 UK — GBP

</button>

<button class="countryOption"

onclick="showOther()">

🌎 Other Country

</button>

<input

id="otherCountry"

class="otherInput"

placeholder="Type your country"

>

<button

id="otherContinue"

class="countryOption"

style="display:none"

onclick="chooseOtherCountry()"

>

Continue

</button>

</div>

</div>

<!-- PRODUCT MODAL -->

<div class="modalOverlay" id="productModal">

<div class="modal">

<button class="close" onclick="closeModal()">✕</button>

<div id="productDetails"></div>

</div>

</div>

<!-- CART -->

<div class="modalOverlay" id="cartModal">

<div class="modal">

<button class="close" onclick="closeCart()">✕</button>

<h2>Your Cart 🛒</h2>

<div id="cartItems"></div>

<div class="total" id="cartTotal"></div>

<button class="checkoutBtn"

onclick="openAddress()">

Checkout

</button>

<button

class="remove"

style="width:100%;margin-top:8px"

onclick="clearCart()"

>

Clear Cart

</button>

</div>

</div>

<!-- ADDRESS -->

<div class="modalOverlay" id="addressModal">

<div class="modal">

<button class="close" onclick="closeAddress()">✕</button>

<h2>Shipping Address 📦</h2>

<input

id="name"

class="addressInput"

placeholder="Full name"

>

<input

id="address"

class="addressInput"

placeholder="Address"

>

<input

id="city"

class="addressInput"

placeholder="City"

>

<input

id="postal"

class="addressInput"

placeholder="Postal code"

>

<input

id="countryAddress"

class="addressInput"

placeholder="Country"

>

<button

class="checkoutBtn"

onclick="payWithStripe()"

>

Continue to Payment 💳

</button>

</div>

</div>

<script>

const products = [

{

id:"slow-rise-butter",

name:"Slow Rise Butter",

price:6,

image:"IMG_1103.jpeg",

colors:[]

},

{

id:"vaseline-butter",

name:"Vaseline Butter",

price:6,

image:"IMG_1096.jpeg",

colors:[]

},

{

id:"crunchy-butter",

name:"Crunchy Butter",

price:6,

image:"IMG_1091.jpeg",

colors:["Blue","Pink"]

},

{

id:"cheese",

name:"Cheese",

price:4,

image:"IMG_1098.jpeg",

colors:[]

},

{

id:"potato",

name:"Potato",

price:6,

image:"IMG_1101.jpeg",

colors:[]

},

{

id:"peach",

name:"Peach",

price:9,

image:"IMG_1093.jpeg",

colors:[]

},

{

id:"crunchy-toast",

name:"Crunchy Toast",

price:6,

image:"IMG_1095.jpeg",

colors:[]

},

{

id:"needoh-cloud",

name:"Needoh Cloud",

price:8,

emoji:"☁️",

colors:[]

},

{

id:"giant-strawberry",

name:"Giant Strawberry",

price:9,

image:"IMG_1094.jpeg",

colors:[]

},

{

id:"slushy-apple",

name:"Slushy Apple",

price:6,

image:"IMG_1100.jpeg",

colors:["Red","Green"]

},

{

id:"duck",

name:"Duck",

price:6,

image:"IMG_1090.jpeg",

colors:["Pink","Blue","Orange","Purple"]

},

{

id:"crunchy-soap",

name:"Crunchy Soap",

price:6,

image:"IMG_1102.jpeg",

colors:[]

},

{

id:"needoh",

name:"Needoh",

price:8,

emoji:"🌈",

colors:["Blue","Pink","Purple"]

},

{

id:"needoh-jellyfish",

name:"Needoh Jellyfish",

price:8,

emoji:"🪼",

colors:["Blue","Pink","Purple"]

},

{

id:"needoh-cake",

name:"Needoh Cake",

price:8,

emoji:"🍰",

colors:[]

},

{

id:"needoh-ice-cream",

name:"Needoh Ice Cream",

price:8,

emoji:"🍦",

colors:["Blue","Pink","Orange"]

},

{

id:"bear",

name:"Bear",

price:3,

image:"IMG_1092.jpeg",

colors:["Pink","Blue","Orange","Purple"]

},

{

id:"coconut-oil-ball",

name:"Coconut Oil Ball",

price:5,

emoji:"🥥",

colors:["Pink","Yellow","Blue","Green"]

},

{

id:"hamster-taba",

name:"Hamster Taba",

price:6,

emoji:"🐹",

colors:["Yellow","White"]

},

{

id:"souffle-taba",

name:"Soufflé Taba",

price:7,

emoji:"🍰",

colors:[]

}

];

let selectedCountry=null;

let currency="USD";

let currencySymbol="$";

let rate=1;

let selectedProduct=null;

let selectedColor=null;

let cart=JSON.parse(

localStorage.getItem("squishyCart") || "[]"

);

const rates={

USD:1,

SGD:1,

THB:32.5,

GBP:0.74

};

function saveCart(){

localStorage.setItem(

"squishyCart",

JSON.stringify(cart)

);

updateCartCount();

}

function updateCartCount(){

document.getElementById("cartCount").textContent =

cart.reduce(

(sum,item)=>sum+item.quantity,

0

);

}

function money(amount){

return currencySymbol +

(amount*rate).toFixed(2);

}

function renderProducts(){

const container=

document.getElementById("products");

container.innerHTML=

products.map(product=>{

let visual="";

if(product.image){

visual=`

<img

src="${product.image}"

alt="${product.name}"

onerror="

this.style.display='none';

this.parentElement.innerHTML='🧸';

"

>

`;

}else{

visual=product.emoji || "🧸";

}

return `

<div class="card">

<div class="cardImage">

${visual}

</div>

<h3>${product.name}</h3>

<div class="price">

${money(product.price)}

</div>

<button

class="viewBtn"

onclick="openProduct('${product.id}')"

>

View

</button>

</div>

`;

}).join("");

}

function chooseCountry(country){

selectedCountry=country;

if(country==="USA"){

currency="USD";

currencySymbol="$";

rate=1;

}

if(country==="Singapore"){

currency="SGD";

currencySymbol="S$";

rate=1;

}

if(country==="Thailand"){

currency="THB";

currencySymbol="฿";

rate=rates.THB;

}

if(country==="UK"){

currency="GBP";

currencySymbol="£";

rate=rates.GBP;

}

document.getElementById(

"countryScreen"

).style.display="none";

document.getElementById(

"currencyMessage"

).textContent=

`Prices are shown in ${currency}.`;

renderProducts();

}

function showOther(){

document.getElementById(

"otherCountry"

).style.display="block";

document.getElementById(

"otherContinue"

).style.display="block";

}

function chooseOtherCountry(){

const country=

document.getElementById(

"otherCountry"

).value.trim();

if(!country){

alert("Please type your country.");

return;

}

selectedCountry=country;

currency="USD";

currencySymbol="$";

rate=1;

document.getElementById(

"countryScreen"

).style.display="none";

document.getElementById(

"currencyMessage"

).textContent=

`Country selected: ${country}`;

renderProducts();

}

function openCountry(){

document.getElementById(

"countryScreen"

).style.display="flex";

}

function openProduct(id){

selectedProduct=

products.find(

p=>p.id===id

);

selectedColor=null;

let html=`

<h2>${selectedProduct.name}</h2>

`;

if(selectedProduct.image){

html+=`

<div class="cardImage">

<img

src="${selectedProduct.image}"

alt="${selectedProduct.name}"

onerror="

this.style.display='none';

"

>

</div>

`;

}else{

html+=`

<div class="cardImage">

${selectedProduct.emoji || "🧸"}

</div>

`;

}

html+=`

<h3>

${money(selectedProduct.price)}

</h3>

`;

if(selectedProduct.colors.length){

html+=`

<p>

<b>Choose a color:</b>

</p>

<div class="colorButtons">

${selectedProduct.colors.map(color=>`

<button

class="colorBtn"

onclick="selectColor('${color}',this)"

>

${color}

</button>

`).join("")}

</div>

`;

}

html+=`

<button

class="addBtn"

onclick="addToCart()"

>

Add to Cart 💗

</button>

`;

document.getElementById(

"productDetails"

).innerHTML=html;

document.getElementById(

"productModal"

).style.display="flex";

}

function selectColor(color,button){

selectedColor=color;

document

.querySelectorAll(".colorBtn")

.forEach(

b=>b.classList.remove("selected")

);

button.classList.add("selected");

}

function addToCart(){

if(!selectedProduct)return;

if(

selectedProduct.colors.length &&

!selectedColor

){

alert("Please choose a color first.");

return;

}

const existing=

cart.find(item=>

item.productId===selectedProduct.id &&

item.color===selectedColor

);

if(existing){

existing.quantity++;

}else{

cart.push({

productId:selectedProduct.id,

color:selectedColor,

quantity:1

});

}

saveCart();

closeModal();

alert("Added to cart! 💗");

}

function closeModal(){

document.getElementById(

"productModal"

).style.display="none";

}

function openCart(){

renderCart();

document.getElementById(

"cartModal"

).style.display="flex";

}

function closeCart(){

document.getElementById(

"cartModal"

).style.display="none";

}

function renderCart(){

const container=

document.getElementById("cartItems");

if(!cart.length){

container.innerHTML=

"<p>Your cart is empty 💗</p>";

document.getElementById(

"cartTotal"

).textContent="";

return;

}

let total=0;

container.innerHTML=

cart.map((item,index)=>{

const product=

products.find(

p=>p.id===item.productId

);

if(!product)return"";

total+=

product.price*

item.quantity;

return `

<div class="cartItem">

<div>

<b>${product.name}</b>

<br>

${item.color

?`Color: ${item.color}<br>`

:""

}

${money(product.price)}

× ${item.quantity}

</div>

<div class="qty">

<button

onclick="changeQty(${index},-1)"

>

−

</button>

<span>

${item.quantity}

</span>

<button

onclick="changeQty(${index},1)"

>

+

</button>

</div>

<button

class="remove"

onclick="removeItem(${index})"

>

✕

</button>

</div>

`;

}).join("");

document.getElementById(

"cartTotal"

).textContent=

"Total: "+money(total);

}

function changeQty(index,amount){

cart[index].quantity+=amount;

if(cart[index].quantity<=0){

cart.splice(index,1);

}

saveCart();

renderCart();

}

function removeItem(index){

cart.splice(index,1);

saveCart();

renderCart();

}

function clearCart(){

cart=[];

saveCart();

renderCart();

}

function openAddress(){

if(!cart.length){

alert("Your cart is empty.");

return;

}

document.getElementById(

"addressModal"

).style.display="flex";

}

function closeAddress(){

document.getElementById(

"addressModal"

).style.display="none";

}

async function payWithStripe(){

const name=

document.getElementById("name")

.value.trim();

const address=

document.getElementById("address")

.value.trim();

const city=

document.getElementById("city")

.value.trim();

const postal=

document.getElementById("postal")

.value.trim();

const country=

document.getElementById("countryAddress")

.value.trim();

if(

!name ||

!address ||

!city ||

!postal ||

!country

){

alert(

"Please fill in your full shipping address."

);

return;

}

const button=

document.querySelector(

"#addressModal .checkoutBtn"

);

button.disabled=true;

button.textContent=

"Opening payment...";

try{

const response=

await fetch(

"https://squishymart.vercel.app/api/create-checkout-session",

{

method:"POST",

headers:{

"Content-Type":

"application/json"

},

body:JSON.stringify({

items:cart,

country:

selectedCountry || country,

currency:currency,

address:{

name,

address,

city,

postal,

country

}

})

}

);

const data=

await response.json();

if(!response.ok){

throw new Error(

data.error ||

"Checkout failed."

);

}

if(!data.url){

throw new Error(

"Stripe checkout URL was not returned."

);

}

window.location.href=

data.url;

}catch(error){

alert(error.message);

button.disabled=false;

button.textContent=

"Continue to Payment 💳";

}

}

updateCartCount();

renderProducts();

</script>

</body>

</html>
