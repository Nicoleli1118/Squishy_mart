<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎀 Squishy Mart</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: linear-gradient(180deg, #ffeaf5, #fff7fb);

  color: #5b3b4a;

}

header {

  background: #ff9fc9;

  padding: 22px 16px;

  text-align: center;

  color: white;

}

header h1 {

  margin: 0;

  font-size: 28px;

}

header p {

  margin: 6px 0 0;

}

.hero {

  text-align: center;

  padding: 30px 16px 20px;

}

.hero h2 {

  font-size: 30px;

  margin: 8px 0;

  color: #e85b9c;

}

.shop {

  max-width: 1100px;

  margin: auto;

  padding: 10px 16px 50px;

}

.shop > h2 {

  text-align: center;

  color: #e85b9c;

}

.grid {

  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));

  gap: 16px;

}

.product {

  background: white;

  border: 3px solid #ffd0e3;

  border-radius: 22px;

  padding: 12px;

  text-align: center;

  cursor: pointer;

  box-shadow: 0 5px 15px #d98aaa22;

}

.product:hover {

  transform: translateY(-4px);

}

.toy {

  height: 155px;

  border-radius: 17px;

  background: #fff0f7;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

}

.toy img {

  width: 100%;

  height: 100%;

  object-fit: contain;

}

.toy span {

  font-size: 70px;

}

.product h3 {

  margin: 10px 4px 5px;

  font-size: 18px;

}

.product p {

  margin: 0 4px 8px;

  font-size: 13px;

  color: #8a6877;

}

.price {

  font-weight: bold;

  color: #e64f94;

  font-size: 18px;

}

footer {

  text-align: center;

  padding: 24px;

  background: #ffd8e9;

}

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background: #4b263755;

  z-index: 50;

  padding: 18px;

  align-items: center;

  justify-content: center;

}

.modal.open {

  display: flex;

}

.modal-box {

  width: min(520px, 100%);

  max-height: 92vh;

  overflow: auto;

  background: white;

  border-radius: 28px;

  padding: 20px;

  position: relative;

}

.close {

  position: absolute;

  right: 12px;

  top: 10px;

  width: 42px;

  height: 42px;

  border: 0;

  border-radius: 50%;

  background: #ffe0ed;

  font-size: 24px;

  cursor: pointer;

}

.modal-visual {

  height: 270px;

  border-radius: 20px;

  background: #fff0f7;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

}

.modal-visual img {

  width: 100%;

  height: 100%;

  object-fit: contain;

}

.modal-visual span {

  font-size: 110px;

}

.modal h2 {

  margin: 15px 0 4px;

  color: #e85b9c;

}

.modal-price {

  font-size: 22px;

  font-weight: bold;

  color: #e64f94;

}

.colors {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin: 12px 0;

}

.color-btn {

  border: 2px solid #ffc3dc;

  background: white;

  color: #6b4556;

  border-radius: 999px;

  padding: 10px 15px;

  cursor: pointer;

}

.color-btn.selected {

  background: #ff9fc9;

  color: white;

}

.order {

  display: block;

  text-align: center;

  text-decoration: none;

  background: #ff78b5;

  color: white;

  font-weight: bold;

  padding: 14px;

  border-radius: 999px;

  margin-top: 16px;

}

@media (max-width: 500px) {

  .grid {

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 10px;

  }

  .toy {

    height: 125px;

  }

  .toy span {

    font-size: 55px;

  }

  .product h3 {

    font-size: 15px;

  }

}

</style>

</head>

<body>

<header>

  <h1>🎀 Squishy Mart</h1>

  <p>Soft, cute & satisfying squishies 💕</p>

</header>

<section class="hero">

  <h2>Shop now ✨</h2>

  <p>Tap any squishy to see it bigger and choose a colour!</p>

</section>

<main class="shop">

  <h2>Our squishies 💕</h2>

  <div id="products" class="grid"></div>

</main>

<div id="productModal" class="modal">

  <div class="modal-box">

    <button class="close" id="closeBtn">×</button>

    <div id="modalVisual" class="modal-visual"></div>

    <h2 id="modalName"></h2>

    <div id="modalPrice" class="modal-price"></div>

    <p id="modalDescription"></p>

    <div id="modalColors" class="colors"></div>

    <a id="modalOrder" class="order" href="#">

      💌 Order by email

    </a>

  </div>

</div>

<footer>

  Made with 💗 for squishy lovers

</footer>

<script>

const products = [

  {

    name: "Slow Rise Butter",

    price: 6,

    emoji: "🧈",

    image: "IMG_1103.jpeg",

    desc: "A soft slow-rise butter squishy."

  },

  {

    name: "Vaseline Butter",

    price: 6,

    emoji: "🧈",

    image: "IMG_1096.jpeg",

    desc: "A cute buttery squishy."

  },

  {

    name: "Crunchy Butter",

    price: 6,

    emoji: "🧈",

    image: "IMG_1091.jpeg",

    desc: "Crunchy Butter in cute colours.",

    colors: ["Blue", "Pink"]

  },

  {

    name: "Cheese",

    price: 6,

    emoji: "🧀",

    image: "IMG_1098.jpeg",

    desc: "A cheesy squishy for your collection."

  },

  {

    name: "Potato",

    price: 6,

    emoji: "🥔",

    image: "IMG_1101.jpeg",

    desc: "Soft potato squishy."

  },

  {

    name: "Peach",

    price: 6,

    emoji: "🍑",

    image: "IMG_1093.jpeg",

    desc: "Soft and cute peach squishy."

  },

  {

    name: "Crunchy Toast",

    price: 6,

    emoji: "🍞",

    image: "IMG_1095.jpeg",

    desc: "A crunchy-looking toast squishy."

  },

  {

    name: "Needoh Cloud",

    price: 8,

    emoji: "☁️",

    image: null,

    desc: "A super soft cloud squishy."

  },

  {

    name: "Giant Strawberry",

    price: 9,

    emoji: "🍓",

    image: "IMG_1094.jpeg",

    desc: "A giant strawberry squishy."

  },

  {

    name: "Slushy Apple",

    price: 6,

    emoji: "🍏",

    image: "IMG_1100.jpeg",

    desc: "Choose your apple colour.",

    colors: ["Red", "Green"]

  },

  {

    name: "Duck",

    price: 6,

    emoji: "🦆",

    image: "IMG_1090.jpeg",

    desc: "Cute duck squishy.",

    colors: ["Pink", "Blue", "Orange", "Purple"]

  },

  {

    name: "Crunchy Soap",

    price: 6,

    emoji: "🧼",

    image: "IMG_1102.jpeg",

    desc: "A cute crunchy soap squishy."

  },

  {

    name: "Needoh",

    price: 8,

    emoji: "🌈",

    image: null,

    desc: "Soft and satisfying Needoh-style squishy."

  },

  {

    name: "Needoh Jellyfish",

    price: 8,

    emoji: "🪼",

    image: null,

    desc: "Cute jellyfish squishy."

  },

  {

    name: "Needoh Cake",

    price: 8,

    emoji: "🍰",

    image: null,

    desc: "Sweet cake-shaped Needoh squishy."

  },

  {

    name: "Needoh Ice Cream",

    price: 8,

    emoji: "🍦",

    image: null,

    desc: "Cute ice cream Needoh squishy."

  },

  {

    name: "Bear",

    price: 3,

    emoji: "🐻",

    image: "IMG_1092.jpeg",

    desc: "Glittery bear squishy.",

    colors: ["Pink", "Blue", "Orange", "Purple"]

  }

];

const grid = document.getElementById("products");

const modal = document.getElementById("productModal");

const modalVisual = document.getElementById("modalVisual");

const modalName = document.getElementById("modalName");

const modalPrice = document.getElementById("modalPrice");

const modalDescription =

  document.getElementById("modalDescription");

const modalColors =

  document.getElementById("modalColors");

const modalOrder =

  document.getElementById("modalOrder");

let currentIndex = 0;

let currentColor = "";

function renderProducts() {

  grid.innerHTML = "";

  products.forEach(function(product, index) {

    const card = document.createElement("article");

    card.className = "product";

    let picture;

    if (product.image) {

      picture =

        '<img src="' +

        product.image +

        '" alt="' +

        product.name +

        '">';

    } else {

      picture =

        "<span>" +

        product.emoji +

        "</span>";

    }

    card.innerHTML =

      '<div class="toy">' +

      picture +

      "</div>" +

      "<h3>" +

      product.name +

      "</h3>" +

      "<p>" +

      product.desc +

      "</p>" +

      '<div class="price">$' +

      product.price +

      "</div>";

    card.addEventListener("click", function() {

      openProduct(index);

    });

    grid.appendChild(card);

  });

}

function openProduct(index) {

  currentIndex = index;

  currentColor = "";

  const product = products[index];

  if (product.image) {

    modalVisual.innerHTML =

      '<img src="' +

      product.image +

      '" alt="' +

      product.name +

      '">';

  } else {

    modalVisual.innerHTML =

      "<span>" +

      product.emoji +

      "</span>";

  }

  modalName.textContent = product.name;

  modalPrice.textContent =

    "$" + product.price;

  modalDescription.textContent =

    product.desc;

  modalColors.innerHTML = "";

  if (product.colors) {

    product.colors.forEach(function(color) {

      const button =

        document.createElement("button");

      button.className = "color-btn";

      button.textContent = color;

      button.addEventListener(

        "click",

        function() {

          currentColor = color;

          document

            .querySelectorAll(".color-btn")

            .forEach(function(btn) {

              btn.classList.remove("selected");

            });

          button.classList.add("selected");

          updateOrder();

        }

      );

      modalColors.appendChild(button);

    });

  }

  updateOrder();

  modal.classList.add("open");

}

function updateOrder() {

  const product =

    products[currentIndex];

  let colourText = "";

  if (currentColor) {

    colourText =

      " Colour: " +

      currentColor +

      ".";

  }

  const subject =

    encodeURIComponent(

      "Squishy Order - " +

      product.name

    );

  const body =

    encodeURIComponent(

      "Hi! I would like to order " +

      product.name +

      " for $" +

      product.price +

      "." +

      colourText

    );

  modalOrder.href =

    "mailto:squishy.mart2026@gmail.com" +

    "?subject=" +

    subject +

    "&body=" +

    body;

}

function closeProduct() {

  modal.classList.remove("open");

}

document

  .getElementById("closeBtn")

  .addEventListener(

    "click",

    closeProduct

  );

modal.addEventListener(

  "click",

  function(event) {

    if (event.target === modal) {

      closeProduct();

    }

  }

);

renderProducts();

</script>

</body>

</html>
