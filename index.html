<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Squishy Mart 🩷</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: linear-gradient(135deg, #ffd6eb, #fff0f8);

  color: #333;

}

button {

  font-family: inherit;

  cursor: pointer;

}

/* HEADER */

header {

  background: #ff8fc7;

  padding: 18px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  position: sticky;

  top: 0;

  z-index: 50;

  box-shadow: 0 3px 12px rgba(0,0,0,0.12);

}

.logo {

  font-size: 24px;

  font-weight: bold;

  color: white;

}

.header-buttons {

  display: flex;

  gap: 8px;

}

.header-btn {

  border: none;

  border-radius: 20px;

  padding: 10px 14px;

  background: white;

  color: #ff5fae;

  font-weight: bold;

}

/* HERO */

.hero {

  text-align: center;

  padding: 35px 15px 20px;

}

.hero h1 {

  color: #ff4fa7;

  font-size: 38px;

  margin: 5px 0;

}

.hero p {

  margin: 8px;

}

.country-display {

  color: #777;

  font-size: 14px;

}

/* SHOP */

.shop {

  max-width: 1100px;

  margin: auto;

  padding: 15px;

}

.products {

  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));

  gap: 18px;

}

.product {

  background: white;

  border-radius: 22px;

  padding: 15px;

  text-align: center;

  box-shadow: 0 5px 15px rgba(0,0,0,0.1);

}

.product img {

  width: 100%;

  height: 160px;

  object-fit: contain;

  border-radius: 15px;

}

.emoji-image {

  height: 160px;

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 90px;

}

.product h3 {

  margin: 10px 0 5px;

  color: #ff55aa;

}

.price {

  font-weight: bold;

  font-size: 19px;

  margin: 7px;

}

.colors {

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 6px;

  margin: 8px 0;

}

.color-btn {

  border: 2px solid #ddd;

  background: white;

  border-radius: 15px;

  padding: 7px 10px;

  font-size: 12px;

}

.color-btn.selected {

  border-color: #ff4fa7;

  background: #ffe0ef;

}

.add-btn {

  border: none;

  background: #ff69b4;

  color: white;

  border-radius: 20px;

  padding: 10px 17px;

  font-weight: bold;

}

/* COUNTRY SCREEN */

.country-screen {

  position: fixed;

  inset: 0;

  background: linear-gradient(135deg, #ffb6da, #fff0f8);

  z-index: 1000;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;

}

.country-box {

  background: white;

  width: min(500px, 100%);

  border-radius: 30px;

  padding: 30px 20px;

  text-align: center;

  box-shadow: 0 10px 35px rgba(0,0,0,0.15);

}

.country-box h1 {

  color: #ff4fa7;

  margin-top: 0;

}

.country-box p {

  color: #777;

}

.country-options {

  display: grid;

  gap: 10px;

  margin-top: 20px;

}

.country-option {

  border: 2px solid #ffd0e6;

  background: #fff7fb;

  padding: 13px;

  border-radius: 18px;

  font-size: 16px;

  font-weight: bold;

  color: #ff4fa7;

}

.country-option.selected {

  background: #ff69b4;

  color: white;

  border-color: #ff69b4;

}

.other-country {

  display: none;

  margin-top: 15px;

}

.other-country input {

  width: 100%;

  padding: 13px;

  border: 2px solid #ffc5df;

  border-radius: 15px;

  font-size: 16px;

}

.next-btn {

  width: 100%;

  margin-top: 20px;

  border: none;

  border-radius: 20px;

  padding: 14px;

  background: #ff69b4;

  color: white;

  font-size: 18px;

  font-weight: bold;

}

.next-btn:disabled {

  background: #ddd;

  cursor: not-allowed;

}

.country-error {

  color: #e74c3c;

  font-size: 14px;

  margin-top: 10px;

}

/* CART */

.cart-panel {

  position: fixed;

  right: -420px;

  top: 0;

  width: min(420px, 100%);

  height: 100%;

  background: white;

  z-index: 200;

  box-shadow: -5px 0 20px rgba(0,0,0,0.2);

  transition: right 0.3s ease;

  padding: 20px;

  overflow-y: auto;

}

.cart-panel.open {

  right: 0;

}

.cart-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.close-cart {

  border: none;

  background: #ffe1ee;

  color: #ff4fa7;

  border-radius: 50%;

  width: 38px;

  height: 38px;

  font-size: 20px;

}

.cart-item {

  border-bottom: 1px solid #eee;

  padding: 15px 0;

}

.cart-item-title {

  font-weight: bold;

  color: #ff4fa7;

}

.cart-item-controls {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 8px;

  flex-wrap: wrap;

}

.qty-btn {

  border: none;

  background: #ffd4e8;

  color: #ff4fa7;

  width: 30px;

  height: 30px;

  border-radius: 10px;

  font-weight: bold;

}

.remove-btn {

  border: none;

  background: #ffdddd;

  color: #d44;

  border-radius: 10px;

  padding: 6px 9px;

}

.cart-total {

  font-size: 23px;

  font-weight: bold;

  color: #ff4fa7;

  margin: 20px 0;

}

.email-btn {

  width: 100%;

  border: none;

  border-radius: 20px;

  padding: 14px;

  background: #ff69b4;

  color: white;

  font-size: 17px;

  font-weight: bold;

}

.clear-btn {

  width: 100%;

  border: none;

  border-radius: 20px;

  padding: 12px;

  margin-top: 8px;

  background: #eee;

}

.empty-cart {

  text-align: center;

  color: #888;

  padding: 30px 0;

}

/* ADDRESS POPUP */

.address-screen {

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,0.45);

  z-index: 500;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.address-box {

  background: white;

  width: min(450px, 100%);

  border-radius: 25px;

  padding: 25px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.2);

}

.address-box h2 {

  color: #ff4fa7;

  text-align: center;

  margin-top: 0;

}

.address-box p {

  text-align: center;

  color: #777;

}

.address-box textarea {

  width: 100%;

  min-height: 130px;

  padding: 14px;

  border: 2px solid #ffc5df;

  border-radius: 15px;

  font-family: Arial, sans-serif;

  font-size: 16px;

  resize: vertical;

}

.address-box button {

  width: 100%;

  border: none;

  border-radius: 20px;

  padding: 14px;

  margin-top: 10px;

  font-weight: bold;

  font-size: 16px;

}

#continueOrderBtn {

  background: #ff69b4;

  color: white;

}

#cancelAddressBtn {

  background: #eee;

  color: #555;

}

.address-error {

  color: #e74c3c;

  text-align: center;

  margin-top: 8px;

}

/* MOBILE */

@media (max-width: 500px) {

  .logo {

    font-size: 20px;

  }

  .hero h1 {

    font-size: 30px;

  }

  .products {

    grid-template-columns: repeat(2, 1fr);

    gap: 10px;

  }

  .product {

    padding: 10px;

  }

  .product img {

    height: 125px;

  }

  .emoji-image {

    height: 125px;

    font-size: 65px;

  }

  .product h3 {

    font-size: 15px;

  }

}

</style>

</head>

<body>

<!-- COUNTRY SCREEN -->

<div class="country-screen" id="countryScreen">

  <div class="country-box">

    <h1>🌎 Choose Your Country</h1>

    <p>

      Choose your country to see prices in your currency.

    </p>

    <div class="country-options">

      <button class="country-option" data-country="USA">

        🇺🇸 USA

      </button>

      <button class="country-option" data-country="Singapore">

        🇸🇬 Singapore

      </button>

      <button class="country-option" data-country="Thailand">

        🇹🇭 Thailand

      </button>

      <button class="country-option" data-country="UK">

        🇬🇧 UK

      </button>

      <button class="country-option" data-country="Other">

        🌎 Other Country

      </button>

    </div>

    <div class="other-country" id="otherCountryBox">

      <input

        id="otherCountryInput"

        type="text"

        placeholder="Type your country"

      >

    </div>

    <div class="country-error" id="countryError"></div>

    <button class="next-btn" id="nextBtn" disabled>

      NEXT →

    </button>

</div>

<!-- HEADER -->

<header>

  <div class="logo">

    🩷 Squishy Mart

  </div>

  <div class="header-buttons">

    <button class="header-btn" id="countryBtn">

      🌎 Country

    </button>

    <button class="header-btn" id="cartBtn">

      🛒 Cart (<span id="cartCount">0</span>)

    </button>

  </div>

</header>

<!-- HERO -->

<section class="hero">

  <h1>🩷 Squishy Mart 🩷</h1>

  <p>

    Super cute squishies for everyone!

  </p>

  <div class="country-display" id="countryDisplay">

    Choose your country

  </div>

</section>

<!-- PRODUCTS -->

<main class="shop">

  <div id="products" class="products"></div>

</main>

<!-- CART -->

<div class="cart-panel" id="cartPanel">

  <div class="cart-header">

    <h2>🛒 Your Cart</h2>

    <button class="close-cart" id="closeCart">

      ×

    </button>

  </div>

  <div id="cartItems"></div>

  <div class="cart-total">

    Total: <span id="cartTotal">US$0.00</span>

  </div>

  <button class="email-btn" id="emailOrder">

    📧 Order by Email

  </button>

  <button class="clear-btn" id="clearCart">

    Clear Cart

  </button>

</div>

<!-- ADDRESS -->

<div class="address-screen" id="addressScreen">

  <div class="address-box">

    <h2>📦 Add Your Address</h2>

    <p>

      Enter your delivery address for your order.

    </p>

    <textarea

      id="addressInput"

      placeholder="House number, street, city, postal code, country"

    ></textarea>

    <div

      id="addressError"

      class="address-error"

    ></div>

    <button id="continueOrderBtn">

      CONTINUE →

    </button>

    <button id="cancelAddressBtn">

      CANCEL

    </button>

  </div>

</div>

<script>

/* SHOP EMAIL */

const SHOP_EMAIL =

  "squishy.mart2026@gmail.com";

/* =========================

   PRODUCTS

========================= */

const products = [

  {

    id: "slow-rise-butter",

    name: "Slow Rise Butter",

    price: 6,

    image: "IMG_1103.jpeg"

  },

  {

    id: "vaseline-butter",

    name: "Vaseline Butter",

    price: 6,

    image: "IMG_1096.jpeg"

  },

  {

    id: "crunchy-butter",

    name: "Crunchy Butter",

    price: 6,

    image: "IMG_1091.jpeg",

    colors: ["Blue", "Pink"]

  },

  {

    id: "cheese",

    name: "Cheese",

    price: 4,

    image: "IMG_1098.jpeg"

  },

  {

    id: "potato",

    name: "Potato",

    price: 6,

    image: "IMG_1101.jpeg"

  },

  {

    id: "peach",

    name: "Peach",

    price: 9,

    image: "IMG_1093.jpeg"

  },

  {

    id: "crunchy-toast",

    name: "Crunchy Toast",

    price: 6,

    image: "IMG_1095.jpeg"

  },

  {

    id: "needoh-cloud",

    name: "Needoh Cloud",

    price: 8,

    emoji: "☁️"

  },

  {

    id: "giant-strawberry",

    name: "Giant Strawberry",

    price: 9,

    image: "IMG_1094.jpeg"

  },

  {

    id: "slushy-apple",

    name: "Slushy Apple",

    price: 6,

    image: "IMG_1100.jpeg",

    colors: ["Red", "Green"]

  },

  {

    id: "duck",

    name: "Duck",

    price: 6,

    image: "IMG_1090.jpeg",

    colors: ["Pink", "Blue", "Orange", "Purple"]

  },

  {

    id: "crunchy-soap",

    name: "Crunchy Soap",

    price: 6,

    image: "IMG_1102.jpeg"

  },

  {

    id: "needoh",

    name: "Needoh",

    price: 8,

    emoji: "🌈"

  },

  {

    id: "needoh-jellyfish",

    name: "Needoh Jellyfish",

    price: 8,

    emoji: "🪼"

  },

  {

    id: "needoh-cake",

    name: "Needoh Cake",

    price: 8,

    emoji: "🍰"

  },

  {

    id: "needoh-ice-cream",

    name: "Needoh Ice Cream",

    price: 8,

    emoji: "🍦"

  },

  {

    id: "bear",

    name: "Bear",

    price: 3,

    image: "IMG_1092.jpeg",

    colors: ["Pink", "Blue", "Orange", "Purple"]

  }

];

/* =========================

   COUNTRY VARIABLES

========================= */

let selectedCountry = "";

let currencyCode = "USD";

let exchangeRate = 1;

/* =========================

   COUNTRY ELEMENTS

========================= */

const countryScreen =

  document.getElementById("countryScreen");

const nextBtn =

  document.getElementById("nextBtn");

const otherCountryBox =

  document.getElementById("otherCountryBox");

const otherCountryInput =

  document.getElementById("otherCountryInput");

const countryError =

  document.getElementById("countryError");

const countryDisplay =

  document.getElementById("countryDisplay");

/* =========================

   COUNTRY CURRENCY LIST

========================= */

const countryCurrencies = {

  "thailand": "THB",

  "uk": "GBP",

  "united kingdom": "GBP",

  "england": "GBP",

  "japan": "JPY",

  "south korea": "KRW",

  "korea": "KRW",

  "china": "CNY",

  "hong kong": "HKD",

  "taiwan": "TWD",

  "malaysia": "MYR",

  "indonesia": "IDR",

  "philippines": "PHP",

  "australia": "AUD",

  "new zealand": "NZD",

  "canada": "CAD",

  "india": "INR",

  "vietnam": "VND",

  "france": "EUR",

  "germany": "EUR",

  "italy": "EUR",

  "spain": "EUR",

  "netherlands": "EUR",

  "belgium": "EUR",

  "ireland": "EUR",

  "portugal": "EUR",

  "switzerland": "CHF",

  "sweden": "SEK",

  "norway": "NOK",

  "denmark": "DKK",

  "poland": "PLN",

  "mexico": "MXN",

  "brazil": "BRL",

  "south africa": "ZAR",

  "united arab emirates": "AED",

  "uae": "AED",

  "saudi arabia": "SAR",

  "qatar": "QAR",

  "israel": "ILS",

  "turkey": "TRY",

  "russia": "RUB"

};

/* =========================

   COUNTRY SELECTION

========================= */

document

  .querySelectorAll(".country-option")

  .forEach(button => {

    button.addEventListener("click", () => {

      document

        .querySelectorAll(".country-option")

        .forEach(b => {

          b.classList.remove("selected");

        });

      button.classList.add("selected");

      selectedCountry =

        button.dataset.country;

      countryError.textContent = "";

      if (

        selectedCountry === "Other"

      ) {

        otherCountryBox.style.display =

          "block";

        otherCountryInput.focus();

      }

      else {

        otherCountryBox.style.display =

          "none";

      }

      nextBtn.disabled = false;

    });

  });

/* =========================

   NEXT

========================= */

nextBtn.addEventListener(

  "click",

  async () => {

    countryError.textContent = "";

    nextBtn.disabled = true;

    nextBtn.textContent = "LOADING...";

    try {

      /* USA */

      if (

        selectedCountry === "USA"

      ) {

        currencyCode = "USD";

        exchangeRate = 1;

      }

      /* SINGAPORE */

      else if (

        selectedCountry === "Singapore"

      ) {

        currencyCode = "SGD";

        /* Special shop rule:

           US$6 = S$6

        */

        exchangeRate = 1;

      }

      /* THAILAND */

      else if (

        selectedCountry === "Thailand"

      ) {

        currencyCode = "THB";

        exchangeRate =

          await getExchangeRate("THB");

      }

      /* UK */

      else if (

        selectedCountry === "UK"

      ) {

        currencyCode = "GBP";

        exchangeRate =

          await getExchangeRate("GBP");

      }

      /* OTHER */

      else if (

        selectedCountry === "Other"

      ) {

        const typedCountry =

          otherCountryInput.value.trim();

        if (!typedCountry) {

          throw new Error(

            "Please type your country."

          );

        }

        currencyCode =

          await findCurrencyForCountry(

            typedCountry

          );

        exchangeRate =

          await getExchangeRate(

            currencyCode

          );

        selectedCountry =

          typedCountry;

      }

      /* SAVE COUNTRY */

      localStorage.setItem(

        "squishyCountry",

        selectedCountry

      );

      localStorage.setItem(

        "squishyCurrency",

        currencyCode

      );

      localStorage.setItem(

        "squishyRate",

        exchangeRate

      );

      /* OPEN SHOP */

      countryScreen.style.display =

        "none";

      countryDisplay.textContent =

        `🌎 ${selectedCountry} • ${currencyCode}`;

      renderProducts();

      renderCart();

    }

    catch (error) {

      console.error(error);

      countryError.textContent =

        error.message ||

        "Something went wrong. Please try again.";

    }

    nextBtn.disabled = false;

    nextBtn.textContent = "NEXT →";

  }

);

/* =========================

   FIND OTHER COUNTRY

========================= */

async function findCurrencyForCountry(

  country

) {

  const clean =

    country.toLowerCase().trim();

  if (

    countryCurrencies[clean]

  ) {

    return countryCurrencies[clean];

  }

  const response =

    await fetch(

      "https://restcountries.com/v3.1/name/" +

      encodeURIComponent(country) +

      "?fields=name,currencies"

    );

  if (!response.ok) {

    throw new Error(

      "I couldn't find that country. Check the spelling."

    );

  }

  const data =

    await response.json();

  if (

    !data.length ||

    !data[0].currencies

  ) {

    throw new Error(

      "I couldn't find that country's currency."

    );

  }

  const currencies =

    Object.keys(

      data[0].currencies

    );

  if (!currencies.length) {

    throw new Error(

      "I couldn't find that country's currency."

    );

  }

  return currencies[0];

}

/* =========================

   EXCHANGE RATE

========================= */

async function getExchangeRate(

  currency

) {

  if (currency === "USD") {

    return 1;

  }

  const response =

    await fetch(

      "https://open.er-api.com/v6/latest/USD"

    );

  if (!response.ok) {

    throw new Error(

      "Currency conversion is unavailable right now."

    );

  }

  const data =

    await response.json();

  if (

    !data.rates ||

    !data.rates[currency]

  ) {

    throw new Error(

      "That currency is not available right now."

    );

  }

  return Number(

    data.rates[currency]

  );

}

/* =========================

   PRICE FORMAT

========================= */

function formatMoney(

  usdPrice

) {

  const amount =

    usdPrice * exchangeRate;

  try {

    return new Intl.NumberFormat(

      undefined,

      {

        style: "currency",

        currency: currencyCode

      }

    ).format(amount);

  }

  catch {

    return (

      currencyCode +

      " " +

      amount.toFixed(2)

    );

  }

}

/* =========================

   RENDER PRODUCTS

========================= */

const productsContainer =

  document.getElementById(

    "products"

  );

function renderProducts() {

  productsContainer.innerHTML = "";

  products.forEach(product => {

    const card =

      document.createElement("div");

    card.className =

      "product";

    let pictureHTML = "";

    if (product.image) {

      pictureHTML = `

        <img

          src="${product.image}"

          alt="${product.name}"

          onerror="

            this.style.display='none';

            this.nextElementSibling.style.display='flex';

          "

        >

        <div

          class="emoji-image"

          style="display:none;"

        >

          🩷

        </div>

      `;

    }

    else {

      pictureHTML = `

        <div class="emoji-image">

          ${product.emoji}

        </div>

      `;

    }

    let colorsHTML = "";

    if (product.colors) {

      colorsHTML = `

        <div

          class="colors"

          id="colors-${product.id}"

        >

          ${product.colors

            .map(

              color => `

                <button

                  type="button"

                  class="color-btn"

                  data-product="${product.id}"

                  data-color="${color}"

                >

                  ${color}

                </button>

              `

            )

            .join("")}

        </div>

      `;

    }

    card.innerHTML = `

      ${pictureHTML}

      <h3>

        ${product.name}

      </h3>

      <div class="price">

        ${formatMoney(product.price)}

      </div>

      ${colorsHTML}

      <button

        type="button"

        class="add-btn"

        data-add="${product.id}"

      >

        🛒 Add to Cart

      </button>

    `;

    productsContainer.appendChild(card);

  });

  /* COLORS */

  document

    .querySelectorAll(".color-btn")

    .forEach(button => {

      button.addEventListener(

        "click",

        () => {

          const productId =

            button.dataset.product;

          document

            .querySelectorAll(

              `.color-btn[data-product="${productId}"]`

            )

            .forEach(b => {

              b.classList.remove(

                "selected"

              );

            });

          button.classList.add(

            "selected"

          );

        }

      );

    });

  /* ADD TO CART */

  document

    .querySelectorAll("[data-add]")

    .forEach(button => {

      button.addEventListener(

        "click",

        () => {

          addToCart(

            button.dataset.add

          );

        }

      );

    });

}

/* =========================

   CART

========================= */

let cart = [];

try {

  const savedCart =

    localStorage.getItem(

      "squishyCart"

    );

  if (savedCart) {

    cart =

      JSON.parse(savedCart);

  }

}

catch {

  cart = [];

}

function saveCart() {

  localStorage.setItem(

    "squishyCart",

    JSON.stringify(cart)

  );

}

/* ADD TO CART */

function addToCart(

  productId

) {

  const product =

    products.find(

      p =>

        p.id === productId

    );

  if (!product) return;

  let color = "";

  if (product.colors) {

    const selectedButton =

      document.querySelector(

        `.color-btn[data-product="${productId}"].selected`

      );

    if (!selectedButton) {

      alert(

        `Please choose a color for ${product.name}.`

      );

      return;

    }

    color =

      selectedButton.dataset.color;

  }

  const existing =

    cart.find(

      item =>

        item.productId === productId &&

        item.color === color

    );

  if (existing) {

    existing.quantity++;

  }

  else {

    cart.push({

      productId:

        productId,

      color:

        color,

      quantity:

        1

    });

  }

  saveCart();

  renderCart();

  document

    .getElementById("cartPanel")

    .classList.add("open");

}

/* =========================

   CART DISPLAY

========================= */

const cartItems =

  document.getElementById(

    "cartItems"

  );

const cartTotal =

  document.getElementById(

    "cartTotal"

  );

const cartCount =

  document.getElementById(

    "cartCount"

  );

function renderCart() {

  cartItems.innerHTML = "";

  let totalUSD = 0;

  let count = 0;

  if (!cart.length) {

    cartItems.innerHTML = `

      <div class="empty-cart">

        🛒 Your cart is empty.

      </div>

    `;

  }

  cart.forEach(

    (item, index) => {

      const product =

        products.find(

          p =>

            p.id === item.productId

        );

      if (!product) return;

      totalUSD +=

        product.price *

        item.quantity;

      count +=

        item.quantity;

      const div =

        document.createElement("div");

      div.className =

        "cart-item";

      div.innerHTML = `

        <div class="cart-item-title">

          ${product.name}

        </div>

        ${

          item.color

            ? `<div>Color: ${item.color}</div>`

            : ""

        }

        <div>

          ${formatMoney(product.price)}

          each

        </div>

        <div class="cart-item-controls">

          <button

            class="qty-btn"

            data-minus="${index}"

          >

            −

          </button>

          <strong>

            ${item.quantity}

          </strong>

          <button

            class="qty-btn"

            data-plus="${index}"

          >

            +

          </button>

          <button

            class="remove-btn"

            data-remove="${index}"

          >

            Remove

          </button>

        </div>

        <div>

          <strong>

            ${formatMoney(

              product.price *

              item.quantity

            )}

          </strong>

        </div>

      `;

      cartItems.appendChild(div);

    }

  );

  cartTotal.textContent =

    formatMoney(totalUSD);

  cartCount.textContent =

    count;

  /* MINUS */

  document

    .querySelectorAll("[data-minus]")

    .forEach(button => {

      button.addEventListener(

        "click",

        () => {

          const index =

            Number(

              button.dataset.minus

            );

          cart[index].quantity--;

          if (

            cart[index].quantity <= 0

          ) {

            cart.splice(

              index,

              1

            );

          }

          saveCart();

          renderCart();

        }

      );

    });

  /* PLUS */

  document

    .querySelectorAll("[data-plus]")

    .forEach(button => {

      button.addEventListener(

        "click",

        () => {

          const index =

            Number(

              button.dataset.plus

            );

          cart[index].quantity++;

          saveCart();

          renderCart();

        }

      );

    });

  /* REMOVE */

  document

    .querySelectorAll("[data-remove]")

    .forEach(button => {

      button.addEventListener(

        "click",

        () => {

          const index =

            Number(

              button.dataset.remove

            );

          cart.splice(

            index,

            1

          );

          saveCart();

          renderCart();

        }

      );

    });

}

   CART BUTTONS

document

document

document
