<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #ffe5f1;

  color: #333;

}

/* HEADER */

header {

  background: #ff8fc4;

  color: white;

  text-align: center;

  padding: 18px 12px;

  position: sticky;

  top: 0;

  z-index: 10;

  box-shadow: 0 3px 12px rgba(0,0,0,.12);

}

header h1 {

  margin: 0 0 12px;

  font-size: 30px;

}

.header-buttons {

  display: flex;

  justify-content: center;

  gap: 8px;

  flex-wrap: wrap;

}

.header-buttons button {

  border: 0;

  background: white;

  color: #ff4f9a;

  padding: 10px 16px;

  border-radius: 22px;

  font-weight: bold;

  cursor: pointer;

}

/* HERO */

.hero {

  text-align: center;

  padding: 30px 15px 15px;

}

.hero h2 {

  color: #ff4f9a;

  margin: 0 0 8px;

  font-size: 28px;

}

.hero p {

  margin: 6px;

}

#currencyText {

  color: #ff4f9a;

  font-weight: bold;

}

/* PRODUCTS */

.products {

  max-width: 1100px;

  margin: auto;

  padding: 20px;

  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

  gap: 18px;

}

.product {

  background: white;

  border-radius: 20px;

  padding: 14px;

  text-align: center;

  box-shadow: 0 4px 12px rgba(0,0,0,.1);

}

.product img {

  width: 100%;

  height: 170px;

  object-fit: contain;

  border-radius: 15px;

  background: #fff6fb;

}

.emoji-product {

  width: 100%;

  height: 170px;

  background: #fff6fb;

  border-radius: 15px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 75px;

}

.product h3 {

  font-size: 17px;

  margin: 12px 0 5px;

}

.price {

  color: #ff4f9a;

  font-size: 19px;

  font-weight: bold;

  margin-bottom: 10px;

}

.add-button {

  width: 100%;

  border: 0;

  border-radius: 20px;

  padding: 11px;

  background: #ff75b5;

  color: white;

  font-weight: bold;

  cursor: pointer;

}

/* COUNTRY SCREEN */

#countryScreen {

  position: fixed;

  inset: 0;

  z-index: 100;

  background: #ffe5f1;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.country-box {

  width: min(500px, 100%);

  background: white;

  border-radius: 28px;

  padding: 28px;

  text-align: center;

  box-shadow: 0 8px 30px rgba(0,0,0,.15);

}

.country-box h2 {

  color: #ff4f9a;

  margin-top: 0;

}

.country-box p {

  color: #666;

}

.country-option {

  width: 100%;

  border: 2px solid transparent;

  background: #fff0f7;

  color: #ff4f9a;

  border-radius: 16px;

  padding: 15px;

  margin: 6px 0;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

.country-option:hover,

.country-option.selected {

  border-color: #ff75b5;

  background: #ffe0ed;

}

#otherArea {

  display: none;

  margin-top: 12px;

}

#otherCountry {

  width: 100%;

  padding: 14px;

  border: 2px solid #ffc2dd;

  border-radius: 15px;

  font-size: 16px;

}

#otherCurrency {

  width: 100%;

  padding: 14px;

  border: 2px solid #ffc2dd;

  border-radius: 15px;

  font-size: 16px;

  margin-top: 8px;

  text-transform: uppercase;

}

#continueOther {

  width: 100%;

  margin-top: 8px;

  padding: 13px;

  border: 0;

  border-radius: 20px;

  background: #ff4f9a;

  color: white;

  font-weight: bold;

}

#errorText {

  color: #e53935;

  margin-top: 10px;

  font-size: 14px;

}

/* MODALS */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 50;

  background: rgba(0,0,0,.5);

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.modal-box {

  width: min(460px, 100%);

  max-height: 90vh;

  overflow-y: auto;

  background: white;

  border-radius: 25px;

  padding: 24px;

  text-align: center;

}

.modal-box img {

  width: 100%;

  height: 220px;

  object-fit: contain;

  border-radius: 15px;

  background: #fff6fb;

}

.modal-box h2 {

  color: #ff4f9a;

}

.color-buttons {

  display: flex;

  justify-content: center;

  gap: 8px;

  flex-wrap: wrap;

  margin: 12px 0;

}

.color-button {

  border: 2px solid transparent;

  background: #ffe2ef;

  color: #ff4f9a;

  padding: 9px 14px;

  border-radius: 18px;

  cursor: pointer;

}

.color-button.selected {

  border-color: #ff4f9a;

  background: #ffc0dc;

}

.modal-add {

  width: 100%;

  border: 0;

  border-radius: 20px;

  padding: 13px;

  background: #ff4f9a;

  color: white;

  font-weight: bold;

  cursor: pointer;

}

.close-button {

  border: 0;

  border-radius: 20px;

  padding: 10px 20px;

  background: #eee;

  color: #555;

  margin-top: 8px;

}

/* CART */

.cart-item {

  background: #fff1f7;

  border-radius: 15px;

  padding: 13px;

  margin-bottom: 10px;

  text-align: left;

}

.cart-item strong {

  color: #ff4f9a;

}

.quantity {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 9px;

}

.quantity button {

  width: 30px;

  height: 30px;

  border: 0;

  border-radius: 50%;

  background: #ff9dcc;

  color: white;

  font-weight: bold;

}

.remove {

  width: auto !important;

  padding: 5px 10px !important;

  border-radius: 10px !important;

  background: #ff6b6b !important;

}

.total {

  color: #ff4f9a;

  font-size: 22px;

  font-weight: bold;

  margin: 18px 0;

}

.email-order,

.clear-cart {

  width: 100%;

  border: 0;

  border-radius: 20px;

  padding: 13px;

  font-weight: bold;

  cursor: pointer;

}

.email-order {

  background: #ff4f9a;

  color: white;

}

.clear-cart {

  background: #eee;

  margin-top: 8px;

  color: #555;

}

@media(max-width:500px) {

  .products {

    grid-template-columns: repeat(2, 1fr);

    gap: 12px;

    padding: 12px;

  }

  .product img,

  .emoji-product {

    height: 130px;

  }

  .product h3 {

    font-size: 15px;

  }

  .price {

    font-size: 16px;

  }

}

</style>

</head>

function convertPrice(usd) {

  return usd * rate;

}

function money(usd) {

  const amount = convertPrice(usd);

  try {

    return new Intl.NumberFormat(

      undefined,

      {

        style: "currency",

        currency: currency

      }

    ).format(amount);

  } catch {

    return currency + " " + amount.toFixed(2);

  }

}

/*

  Singapore is intentionally 1:1:

  $6 USD → S$6

*/

async function getRate(currencyCode) {

  if (

    currencyCode === "USD" ||

    currencyCode === "SGD"

  ) {

    rate = 1;

    return true;

  }

  try {

    const response = await fetch(

      "https://open.er-api.com/v6/latest/USD"

    );

    if (!response.ok) {

      throw new Error("Rate error");

    }

    const data = await response.json();

    if (

      !data.rates ||

      typeof data.rates[currencyCode] !== "number"

    ) {

      throw new Error("Currency not found");

    }

    rate = data.rates[currencyCode];

    return true;

  } catch {

    return false;

  }

}

async function chooseCountry(

  chosenCountry,

  chosenCurrency

) {

  errorText.textContent = "";

  country = chosenCountry;

  currency = chosenCurrency;

  /*

    IMPORTANT:

    Hide the country screen immediately.

    This makes sure the shopping page appears.

  */

  countryScreen.style.display = "none";

  const success =

    await getRate(chosenCurrency);

  if (!success) {

    countryScreen.style.display = "flex";

    errorText.textContent =

      "We couldn't get the currency rate. Please try again.";

    return;

  }

  localStorage.setItem(

    "squishyCountry",

    country

  );

  localStorage.setItem(

    "squishyCurrency",

    currency

  );

  showShop();

}
