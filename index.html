<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Squishy Mart 💗</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  font-family:Arial,sans-serif;

  background:#ffe4f1;

  color:#444;

}

header{

  background:#ff8fc4;

  color:white;

  padding:14px 16px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  position:sticky;

  top:0;

  z-index:50;

}

header h1{

  margin:0;

  font-size:24px;

}

.header-actions{

  display:flex;

  gap:7px;

}

button{

  border:0;

  cursor:pointer;

  font-family:inherit;

}

.top-btn{

  background:white;

  color:#ff5fa4;

  border-radius:20px;

  padding:9px 12px;

  font-weight:bold;

}

.hero{

  text-align:center;

  padding:30px 15px 20px;

}

.hero h2{

  color:#ff5fa4;

  font-size:30px;

  margin:0 0 8px;

}

.hero p{

  margin:0;

  color:#777;

  font-size:18px;

}

.currency-message{

  text-align:center;

  color:#ff5fa4;

  font-weight:bold;

  margin:5px 15px 20px;

}

.products{

  width:94%;

  max-width:1150px;

  margin:auto;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:18px;

  padding-bottom:40px;

}

.product{

  background:white;

  border-radius:20px;

  padding:12px;

  text-align:center;

  box-shadow:0 3px 12px rgba(0,0,0,.08);

  transition:.2s;

  cursor:pointer;

}

.product:hover{

  transform:translateY(-4px);

}

.product-img{

  width:100%;

  height:175px;

  object-fit:contain;

  border-radius:15px;

  background:#fff8fc;

}

.emoji-img{

  width:100%;

  height:175px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#fff8fc;

  border-radius:15px;

  font-size:75px;

}

.product h3{

  margin:10px 0 5px;

  font-size:17px;

}

.price{

  color:#ff5fa4;

  font-size:18px;

  font-weight:bold;

  margin:6px 0 10px;

}

.add-btn{

  background:#ff8fc4;

  color:white;

  border-radius:20px;

  padding:9px 15px;

  font-weight:bold;

}

.overlay{

  display:none;

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  z-index:100;

  align-items:center;

  justify-content:center;

  padding:15px;

}

.modal{

  width:100%;

  max-width:440px;

  max-height:90vh;

  overflow:auto;

  background:white;

  border-radius:23px;

  padding:22px;

  text-align:center;

}

.modal h2{

  color:#ff5fa4;

  margin-top:8px;

}

.close{

  float:right;

  width:32px;

  height:32px;

  border-radius:50%;

  background:#eee;

  font-size:20px;

}

.country-btn{

  width:100%;

  padding:14px;

  margin:7px 0;

  border-radius:15px;

  background:#ffe0ed;

  color:#ff4f9c;

  font-weight:bold;

  font-size:16px;

}

.country-btn:hover{

  background:#ffc8df;

}

input,textarea{

  width:100%;

  border:2px solid #ffc1dc;

  border-radius:12px;

  padding:12px;

  font-size:16px;

  margin:7px 0;

}

.primary{

  background:#ff72b4;

  color:white;

  padding:12px 20px;

  border-radius:20px;

  font-weight:bold;

  margin-top:8px;

}

.secondary{

  background:#eee;

  color:#555;

  padding:10px 18px;

  border-radius:20px;

  margin-top:8px;

}

.color-btn{

  background:#ffe0ed;

  color:#ff4f9c;

  padding:9px 14px;

  border-radius:15px;

  margin:4px;

}

.color-btn.selected{

  background:#ff72b4;

  color:white;

}

.modal-product-img{

  width:100%;

  height:230px;

  object-fit:contain;

  border-radius:15px;

  background:#fff8fc;

}

.cart-item{

  text-align:left;

  padding:13px 0;

  border-bottom:1px solid #eee;

}

.quantity{

  display:flex;

  align-items:center;

  gap:8px;

  margin-top:8px;

}

.quantity button{

  width:31px;

  height:31px;

  border-radius:50%;

  background:#ff9bc8;

  color:white;

  font-size:18px;

}

.remove{

  margin-left:auto;

  width:auto!important;

  padding:4px 10px!important;

  border-radius:12px!important;

  background:#ff6b9f!important;

}

.total{

  color:#ff5fa4;

  font-size:21px;

  font-weight:bold;

  margin:17px 0;

}

#loading{

  text-align:center;

  color:#ff5fa4;

  font-weight:bold;

  grid-column:1/-1;

}

@media(max-width:850px){

  .products{

    grid-template-columns:repeat(2,1fr);

  }

}

@media(max-width:450px){

  header h1{font-size:19px}

  .top-btn{font-size:12px;padding:8px 9px}

  .products{gap:10px}

  .product{padding:8px}

  .product-img,.emoji-img{height:130px}

  .hero h2{font-size:25px}

}

</style>

</head>

<body>

<header>

  <h1>Squishy Mart 💗</h1>

  <div class="header-actions">

    <button class="top-btn" onclick="openCountry()">🌎 Country</button>

    <button class="top-btn" onclick="openCart()">

      🛒 Cart (<span id="cartCount">0</span>)

    </button>

  </div>

</header>

<section class="hero">

  <h2>Welcome to Squishy Mart! 🧸</h2>

  <p>Pick your favourite squishy! 💕</p>

</section>

<div class="currency-message" id="currencyMessage">

  Choose your country to see prices.

</div>

<div class="products" id="products">

  <div id="loading">Loading squishies... 💕</div>

</div>

<!-- COUNTRY MODAL -->

<div class="overlay" id="countryModal">

  <div class="modal">

    <h2>Choose Your Country 🌎</h2>

    <p>Prices will automatically use your country's currency.</p>

    <button class="country-btn" onclick="selectCountry('USA')">

      🇺🇸 USA

    </button>

    <button class="country-btn" onclick="selectCountry('Singapore')">

      🇸🇬 Singapore

    </button>

    <button class="country-btn" onclick="selectCountry('Thailand')">

      🇹🇭 Thailand

    </button>

    <button class="country-btn" onclick="selectCountry('UK')">

      🇬🇧 UK

    </button>

    <button class="country-btn" onclick="showOther()">

      🌎 Other Country

    </button>

    <div id="otherBox" style="display:none">

      <input id="otherCountry" placeholder="Type your country">

      <button class="primary" onclick="selectOther()">

        NEXT

      </button>

    </div>

  </div>

</div>

<!-- PRODUCT MODAL -->

<div class="overlay" id="productModal">

  <div class="modal">

    <button class="close" onclick="closeProduct()">×</button>

    <img id="modalImage" class="modal-product-img">

    <h2 id="modalName"></h2>

    <div class="price" id="modalPrice"></div>

    <div id="colorArea"></div>

    <button class="primary" onclick="addSelectedToCart()">

      🛒 Add to Cart

    </button>

  </div>

</div>

<!-- CART MODAL -->

<div class="overlay" id="cartModal">

  <div class="modal">

    <button class="close" onclick="closeCart()">×</button>

    <h2>🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <div class="total" id="cartTotal"></div>

    <button class="primary" onclick="startOrder()">

      📧 Order by Email

    </button>

    <br>

    <button class="secondary" onclick="clearCart()">

      Clear Cart

    </button>

  </div>

</div>

<!-- ADDRESS MODAL -->

<div class="overlay" id="addressModal">

  <div class="modal">

    <h2>📦 Delivery Address</h2>

    <p>Where should we deliver your squishies?</p>

    <textarea

      id="address"

      rows="5"

      placeholder="Name, address, postal code..."

    ></textarea>

    <button

      class="primary"

      id="paymentButton"

      onclick="goToPayment()">

      Continue to Payment 💳

    </button>

    <br>

    <button class="secondary" onclick="closeAddress()">

      Cancel

    </button>

  </div>

</div>

<script>

const products = [

  {

    id:"slow-rise-butter",

    name:"Slow Rise Butter",

    price:6,

    image:"IMG_1103.jpeg",

    colors:[]

  },

  {

    id:"vaseline-butter",

    name:"Vaseline Butter",

    price:6,

    image:"IMG_1096.jpeg",

    colors:[]

  },

  {

    id:"crunchy-butter",

    name:"Crunchy Butter",

    price:6,

    image:"IMG_1091.jpeg",

    colors:["Blue","Pink"]

  },

  {

    id:"cheese",

    name:"Cheese",

    price:4,

    image:"IMG_1098.jpeg",

    colors:[]

  },

  {

    id:"potato",

    name:"Potato",

    price:6,

    image:"IMG_1101.jpeg",

    colors:[]

  },

  {

    id:"peach",

    name:"Peach",

    price:9,

    image:"IMG_1093.jpeg",

    colors:[]

  },

  {

    id:"crunchy-toast",

    name:"Crunchy Toast",

    price:6,

    image:"IMG_1095.jpeg",

    colors:[]

  },

  {

    id:"needoh-cloud",

    name:"Needoh Cloud",

    price:8,

    emoji:"☁️",

    colors:[]

  },

  {

    id:"giant-strawberry",

    name:"Giant Strawberry",

    price:9,

    image:"IMG_1094.jpeg",

    colors:[]

  },

  {

    id:"slushy-apple",

    name:"Slushy Apple",

    price:6,

    image:"IMG_1100.jpeg",

    colors:["Red","Green"]

  },

  {

    id:"duck",

    name:"Duck",

    price:6,

    image:"IMG_1090.jpeg",

    colors:["Pink","Blue","Orange","Purple"]

  },

  {

    id:"crunchy-soap",

    name:"Crunchy Soap",

    price:6,

    image:"IMG_1102.jpeg",

    colors:[]

  },

  {

    id:"needoh",

    name:"Needoh",

    price:8,

    emoji:"🌈",

    colors:["Blue","Pink","Purple"]

  },

  {

    id:"needoh-jellyfish",

    name:"Needoh Jellyfish",

    price:8,

    emoji:"🪼",

    colors:["Blue","Pink","Purple"]

  },

  {

    id:"needoh-cake",

    name:"Needoh Cake",

    price:8,

    emoji:"🍰",

    colors:[]

  },

  {

    id:"needoh-ice-cream",

    name:"Needoh Ice Cream",

    price:8,

    emoji:"🍦",

    colors:["Blue","Pink","Orange"]

  },

  {

    id:"bear",

    name:"Bear",

    price:3,

    image:"IMG_1092.jpeg",

    colors:["Pink","Blue","Orange","Purple"]

  }

];

let country =

  localStorage.getItem("country") || "";

let currency =

  localStorage.getItem("currency") || "USD";

let symbol =

  localStorage.getItem("symbol") || "$";

let cart =

  JSON.parse(localStorage.getItem("cart") || "[]");

let selectedProduct = null;

let selectedColor = null;

/* COUNTRY */

function openCountry(){

  document

    .getElementById("countryModal")

    .style.display="flex";

}

function showOther(){

  document

    .getElementById("otherBox")

    .style.display="block";

}

function selectCountry(name){

  country=name;

  if(name==="USA"){

    currency="USD";

    symbol="$";

  }

  if(name==="Singapore"){

    currency="SGD";

    symbol="S$";

  }

  if(name==="Thailand"){

    currency="THB";

    symbol="฿";

  }

  if(name==="UK"){

    currency="GBP";

    symbol="£";

  }

  saveCountry();

  document

    .getElementById("countryModal")

    .style.display="none";

  renderProducts();

}

async function selectOther(){

  const name =

    document

      .getElementById("otherCountry")

      .value

      .trim();

  if(!name){

    alert("Please type your country.");

    return;

  }

  try{

    const response =

      await fetch(

        "https://restcountries.com/v3.1/name/"

        +encodeURIComponent(name)

      );

    const data =

      await response.json();

    if(!data[0]?.currencies){

      throw new Error();

    }

    country=name;

    currency =

      Object.keys(data[0].currencies)[0];

    const symbols={

      USD:"$",

      SGD:"S$",

      THB:"฿",

      GBP:"£",

      EUR:"€",

      JPY:"¥",

      KRW:"₩",

      CNY:"¥",

      HKD:"HK$",

      AUD:"A$",

      CAD:"C$",

      INR:"₹",

      MYR:"RM",

      PHP:"₱",

      NZD:"NZ$"

    };

    symbol =

      symbols[currency] ||

      currency+" ";

    saveCountry();

    document

      .getElementById("countryModal")

      .style.display="none";

    renderProducts();

  }catch{

    alert(

      "I couldn't find that country. Please check the spelling."

    );

  }

}

function saveCountry(){

  localStorage.setItem("country",country);

  localStorage.setItem("currency",currency);

  localStorage.setItem("symbol",symbol);

}

/* MONEY */

async function getRate(){

  if(currency==="USD") return 1;

  /*

    Singapore intentionally uses S$1 = US$1

    for the website's requested pricing system.

  */

  if(currency==="SGD") return 1;

  try{

    const response =

      await fetch(

        "https://open.er-api.com/v6/latest/USD"

      );

    const data =

      await response.json();

    return data.rates[currency] || 1;

  }catch{

    return 1;

  }

}

function money(amount){

  if(

    currency==="JPY" ||

    currency==="KRW" ||

    currency==="VND"

  ){

    return symbol+Math.round(amount);

  }

  return symbol+amount.toFixed(2);

}

/* PRODUCTS */

async function renderProducts(){

  const area =

    document.getElementById("products");

  area.innerHTML =

    '<div id="loading">Loading prices... 💕</div>';

  const rate =

    await getRate();

  area.innerHTML="";

  products.forEach(product=>{

    const card =

      document.createElement("div");

    card.className="product";

    let picture="";

    if(product.image){

      picture=`

        <img

          class="product-img"

          src="${product.image}"

          alt="${product.name}"

          onerror="this.outerHTML='<div class=emoji-img>💕</div>'"

        >

      `;

    }else{

      picture=`

        <div class="emoji-img">

          ${product.emoji}

        </div>

      `;

    }

    card.innerHTML=`

      ${picture}

      <h3>${product.name}</h3>

      <div class="price">

        ${money(product.price*rate)}

      </div>

      <button class="add-btn">

        View & Add

      </button>

    `;

    card.onclick=()=>{

      openProduct(product);

    };

    area.appendChild(card);

  });

  document

    .getElementById("currencyMessage")

    .textContent =

      country

      ? `Prices shown in ${currency} for ${country} 💕`

      : "Choose your country to see prices.";

  updateCartCount();

}

/* PRODUCT */

async function openProduct(product){

  if(!country){

    openCountry();

    return;

  }

  selectedProduct=product;

  selectedColor=null;

  const rate =

    await getRate();

  document

    .getElementById("modalName")

    .textContent=product.name;

  document

    .getElementById("modalPrice")

    .textContent=

      money(product.price*rate);

  const image =

    document.getElementById("modalImage");

  if(product.image){

    image.src=product.image;

  }else{

    image.src=

      "data:image/svg+xml;charset=UTF-8,"+

      encodeURIComponent(`

        <svg xmlns="http://www.w3.org/2000/svg"

             width="400" height="300">

          <rect width="100%" height="100%"

                fill="#fff8fc"/>

          <text x="50%" y="55%"

                text-anchor="middle"

                font-size="110">

            ${product.emoji}

          </text>

        </svg>

      `);

  }

  const colors =

    document.getElementById("colorArea");

  colors.innerHTML="";

  if(product.colors.length){

    colors.innerHTML=

      "<p><b>Choose a color:</b></p>";

    product.colors.forEach(color=>{

      const button =

        document.createElement("button");

      button.className="color-btn";

      button.textContent=color;

      button.onclick=event=>{

        event.stopPropagation();

        selectedColor=color;

        document

          .querySelectorAll(".color-btn")

          .forEach(x=>

            x.classList.remove("selected")

          );

        button.classList.add("selected");

      };

      colors.appendChild(button);

    });

  }

  document

    .getElementById("productModal")

    .style.display="flex";

}

function closeProduct(){

  document

    .getElementById("productModal")

    .style.display="none";

}

/* CART */

function addSelectedToCart(){

  if(!selectedProduct) return;

  if(

    selectedProduct.colors.length &&

    !selectedColor

  ){

    alert("Please choose a color first. 💕");

    return;

  }

  const existing =

    cart.find(item=>

      item.productId===selectedProduct.id &&

      item.color===selectedColor

    );

  if(existing){

    existing.quantity++;

  }else{

    cart.push({

      productId:selectedProduct.id,

      color:selectedColor,

      quantity:1

    });

  }

  saveCart();

  updateCartCount();

  closeProduct();

  alert("Added to your cart! 🛒💕");

}

function saveCart(){

  localStorage.setItem(

    "cart",

    JSON.stringify(cart)

  );

}

function updateCartCount(){

  const count =

    cart.reduce(

      (total,item)=>

        total+item.quantity,

      0

    );

  document

    .getElementById("cartCount")

    .textContent=count;

}

async function openCart(){

  await renderCart();

  document

    .getElementById("cartModal")

    .style.display="flex";

}

function closeCart(){

  document

    .getElementById("cartModal")

    .style.display="none";

}

async function renderCart(){

  const area =

    document.getElementById("cartItems");

  if(!cart.length){

    area.innerHTML=

      "<p>Your cart is empty 💕</p>";

    document

      .getElementById("cartTotal")

      .textContent="";

    return;

  }

  const rate =

    await getRate();

  area.innerHTML="";

  let total=0;

  cart.forEach((item,index)=>{

    const product =

      products.find(

        p=>p.id===item.productId

      );

    if(!product) return;

    const subtotal =

      product.price*

      rate*

      item.quantity;

    total+=subtotal;

    const row =

      document.createElement("div");

    row.className="cart-item";

    row.innerHTML=`

      <b>${product.name}</b>

      ${

        item.color

        ? `<br>Color: ${item.color}`

        : ""

      }

      <br>

      ${money(product.price*rate)} each

      <div class="quantity">

        <button onclick="changeQty(${index},-1)">

          −

        </button>

        <span>${item.quantity}</span>

        <button onclick="changeQty(${index},1)">

          +

        </button>

        <button

          class="remove"

          onclick="removeItem(${index})">

          Remove

        </button>

      </div>

    `;

    area.appendChild(row);

  });

  document

    .getElementById("cartTotal")

    .textContent=

      "Total: "+money(total);

}

async function changeQty(index,change){

  cart[index].quantity+=change;

  if(cart[index].quantity<=0){

    cart.splice(index,1);

  }

  saveCart();

  updateCartCount();

  renderCart();

}

function removeItem(index){

  cart.splice(index,1);

  saveCart();

  updateCartCount();

  renderCart();

}

function clearCart(){

  if(!confirm("Clear your cart?")) return;

  cart=[];

  saveCart();

  updateCartCount();

  renderCart();

}

/* ADDRESS */

function startOrder(){

  if(!cart.length){

    alert("Your cart is empty.");

    return;

  }

  closeCart();

  document

    .getElementById("addressModal")

    .style.display="flex";

}

function closeAddress(){

  document

    .getElementById("addressModal")

    .style.display="none";

}

/* STRIPE */

async function goToPayment(){

  const address =

    document

      .getElementById("address")

      .value

      .trim();

  if(!address){

    alert("Please enter your delivery address.");

    return;

  }

  const button =

    document.getElementById("paymentButton");

  button.disabled=true;

  button.textContent=

    "Opening secure payment... 💳";

  try{

    const response =

      await fetch(

        "/api/create-checkout-session",

        {

          method:"POST",

          headers:{

            "Content-Type":

              "application/json"

          },

          body:JSON.stringify({

            country:country,

            address:address,

            cart:cart

          })

        }

      );

    const data =

      await response.json();

    if(!response.ok){

      throw new Error(

        data.error ||

        "Payment could not be started."

      );

    }

    window.location.href=data.url;

  }catch(error){

    alert(

      error.message ||

      "Something went wrong. Please try again."

    );

    button.disabled=false;

    button.textContent=

      "Continue to Payment 💳";

  }

}

/* START WEBSITE */

updateCartCount();

renderProducts();

if(!country){

  setTimeout(()=>{

    openCountry();

  },500);

}

</script>

</body>

</html>
