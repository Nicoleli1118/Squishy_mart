<title>Squishy Mart 🩷</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: linear-gradient(135deg, #ffd6eb, #fff0f8);

  color: #333;

}

button {

  font-family: inherit;

  cursor: pointer;

}

header {

  background: #ff8fc7;

  padding: 18px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  position: sticky;

  top: 0;

  z-index: 50;

  box-shadow: 0 3px 12px rgba(0,0,0,0.12);

}

.logo {

  font-size: 24px;

  font-weight: bold;

  color: white;

}

.header-buttons {

  display: flex;

  gap: 8px;

}

.header-btn {

  border: none;

  border-radius: 20px;

  padding: 10px 14px;

  background: white;

  color: #ff5fae;

  font-weight: bold;

}

.hero {

  text-align: center;

  padding: 35px 15px 20px;

}

.hero h1 {

  color: #ff4fa7;

  font-size: 38px;

  margin: 5px 0;

}

.hero p {

  margin: 8px;

}

.country-display {

  color: #777;

  font-size: 14px;

}

.shop {

  max-width: 1100px;

  margin: auto;

  padding: 15px;

}

.products {

  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));

  gap: 18px;

}

.product {

  background: white;

  border-radius: 22px;

  padding: 15px;

  text-align: center;

  box-shadow: 0 5px 15px rgba(0,0,0,0.1);

}

.product img {

  width: 100%;

  height: 160px;

  object-fit: contain;

  border-radius: 15px;

}

.emoji-image {

  height: 160px;

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 90px;

}

.product h3 {

  margin: 10px 0 5px;

  color: #ff55aa;

}

.price {

  font-weight: bold;

  font-size: 19px;

  margin: 7px;

}

.colors {

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 6px;

  margin: 8px 0;

}

.color-btn {

  border: 2px solid #ddd;

  background: white;

  border-radius: 15px;

  padding: 6px 9px;

  font-size: 12px;

}

.color-btn.selected {

  border-color: #ff4fa7;

  background: #ffe0ef;

}

.add-btn {

  border: none;

  background: #ff69b4;

  color: white;

  border-radius: 20px;

  padding: 10px 17px;

  font-weight: bold;

}

.add-btn:hover {

  background: #ff459f;

}

/* COUNTRY SCREEN */

.country-screen {

  position: fixed;

  inset: 0;

  background: linear-gradient(135deg, #ffb6da, #fff0f8);

  z-index: 1000;

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 20px;

}

.country-box {

  background: white;

  width: min(500px, 100%);

  border-radius: 30px;

  padding: 30px 20px;

  text-align: center;

  box-shadow: 0 10px 35px rgba(0,0,0,0.15);

}

.country-box h1 {

  color: #ff4fa7;

  margin-top: 0;

}

.country-box p {

  color: #777;

}

.country-options {

  display: grid;

  gap: 10px;

  margin-top: 20px;

}

.country-option {

  border: 2px solid #ffd0e6;

  background: #fff7fb;

  padding: 13px;

  border-radius: 18px;

  font-size: 16px;

  font-weight: bold;

  color: #ff4fa7;

}

.country-option.selected {

  background: #ff69b4;

  color: white;

  border-color: #ff69b4;

}

.other-country {

  display: none;

  margin-top: 15px;

}

.other-country input {

  width: 100%;

  padding: 13px;

  border: 2px solid #ffc5df;

  border-radius: 15px;

  font-size: 16px;

}

.next-btn {

  width: 100%;

  margin-top: 20px;

  border: none;

  border-radius: 20px;

  padding: 14px;

  background: #ff69b4;

  color: white;

  font-size: 18px;

  font-weight: bold;

}

.next-btn:disabled {

  background: #ddd;

  cursor: not-allowed;

}

.country-error {

  color: #e74c3c;

  font-size: 14px;

  margin-top: 10px;

}

/* CART */

.cart-panel {

  position: fixed;

  right: -420px;

  top: 0;

  width: min(420px, 100%);

  height: 100%;

  background: white;

  z-index: 200;

  box-shadow: -5px 0 20px rgba(0,0,0,0.2);

  transition: right 0.3s ease;

  padding: 20px;

  overflow-y: auto;

}

.cart-panel.open {

  right: 0;

}

.cart-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

}

.close-cart {

  border: none;

  background: #ffe1ee;

  color: #ff4fa7;

  border-radius: 50%;

  width: 38px;

  height: 38px;

  font-size: 20px;

}

.cart-item {

  border-bottom: 1px solid #eee;

  padding: 15px 0;

}

.cart-item-title {

  font-weight: bold;

  color: #ff4fa7;

}

.cart-item-controls {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 8px;

}

.qty-btn {

  border: none;

  background: #ffd4e8;

  color: #ff4fa7;

  width: 30px;

  height: 30px;

  border-radius: 10px;

  font-weight: bold;

}

.remove-btn {

  border: none;

  background: #ffdddd;

  color: #d44;

  border-radius: 10px;

  padding: 6px 9px;

}

.cart-total {

  font-size: 23px;

  font-weight: bold;

  color: #ff4fa7;

  margin: 20px 0;

}

.email-btn {

  width: 100%;

  border: none;

  border-radius: 20px;

  padding: 14px;

  background: #ff69b4;

  color: white;

  font-size: 17px;

  font-weight: bold;

}

.clear-btn {

  width: 100%;

  border: none;

  border-radius: 20px;

  padding: 12px;

  margin-top: 8px;

  background: #eee;

}

.empty-cart {

  text-align: center;

  color: #888;

  padding: 30px 0;

}

.loading {

  text-align: center;

  color: #ff4fa7;

  font-weight: bold;

  padding: 20px;

}

@media (max-width: 500px) {

  .logo {

    font-size: 20px;

  }

  .hero h1 {

    font-size: 30px;

  }

  .products {

    grid-template-columns: repeat(2, 1fr);

    gap: 10px;

  }

  .product {

    padding: 10px;

  }

  .product img {

    height: 125px;

  }

  .emoji-image {

    height: 125px;

    font-size: 65px;

  }

  .product h3 {

    font-size: 15px;

  }

}

</style>

</head>

<script>

const SHOP_EMAIL = "squishy.mart2026@gmail.com";

/* =========================

========================= */

const products = [

  {

    id: "slow-rise-butter",

    name: "Slow Rise Butter",

    price: 6,

  },

  {

  },

  {

  },

  },

  },

  {

  },

  {

  },

  {

  },

  },

  {

    image: "IMG_1102.jpeg"

  },

  {

    id: "needoh",

  },

  {

    id: "needoh-jellyfish",

    name: "Needoh Jellyfish",

    price: 8,

    emoji: "🪼"

  },

  {

    name: "Needoh Cake",

  },

  {

    id: "needoh-ice-cream",

    name: "Needoh Ice Cream",

    emoji: "🍦"

  },

  {

    id: "bear",

    name: "Bear",

    image: "IMG_1092.jpeg",

    colors: ["Pink", "Blue", "Orange", "Purple"]

  }

];

/* =========================

   COUNTRY / CURRENCY

========================= */

let selectedCountry = "";

let currencyCode = "USD";

let exchangeRate = 1;

const countryScreen = document.getElementById("countryScreen");

const nextBtn = document.getElementById("nextBtn");

const otherCountryBox = document.getElementById("otherCountryBox");

const otherCountryInput = document.getElementById("otherCountryInput");

const countryError = document.getElementById("countryError");

const countryDisplay = document.getElementById("countryDisplay");

/*

  Singapore is intentionally 1:1 because

  that is the pricing rule for your shop.

*/

const fixedCurrencies = {

  "USA": {

    currency: "USD",

    rate: 1

  },

  "Singapore": {

    currency: "SGD",

    rate: 1

  }

};

/* Common country → currency list */

const countryCurrencies = {

  "thailand": "THB",

  "uk": "GBP",

  "united kingdom": "GBP",

  "england": "GBP",

  "japan": "JPY",

  "south korea": "KRW",

  "korea": "KRW",

  "china": "CNY",

  "hong kong": "HKD",

  "taiwan": "TWD",

  "malaysia": "MYR",

  "indonesia": "IDR",

  "philippines": "PHP",

  "australia": "AUD",

  "new zealand": "NZD",

  "canada": "CAD",

  "india": "INR",

  "vietnam": "VND",

  "france": "EUR",

  "germany": "EUR",

  "italy": "EUR",

  "spain": "EUR",

  "netherlands": "EUR",

  "belgium": "EUR",

  "portugal": "EUR",

  "sweden": "SEK",

  "united arab emirates": "AED",

  "uae": "AED",

  "saudi arabia": "SAR",

  "qatar": "QAR",

  "israel": "ILS",

  "turkey": "TRY",

  "russia": "RUB"

};

/* =========================

   COUNTRY BUTTONS

========================= */

document.querySelectorAll(".country-option").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".country-option")

      .forEach(b => b.classList.remove("selected"));

    button.classList.add("selected");

    selectedCountry = button.dataset.country;

    countryError.textContent = "";

    if (selectedCountry === "Other") {

      otherCountryBox.style.display = "block";

      otherCountryInput.focus();

    } else {

      otherCountryBox.style.display = "none";

    }

    nextBtn.disabled = false;

  });

});

/* =========================

   NEXT BUTTON

========================= */

nextBtn.addEventListener("click", async () => {

  countryError.textContent = "";

  nextBtn.disabled = true;

  nextBtn.textContent = "LOADING...";

  try {

    if (selectedCountry === "USA") {

      currencyCode = "USD";

      exchangeRate = 1;

    }

    else if (selectedCountry === "Singapore") {

      currencyCode = "SGD";

      // Special Squishy Mart rule:

      // US$6 → S$6

      exchangeRate = 1;

    }

    else if (selectedCountry === "Thailand") {

      currencyCode = "THB";

      exchangeRate = await getExchangeRate("THB");

    }

    else if (selectedCountry === "UK") {

      currencyCode = "GBP";

      exchangeRate = await getExchangeRate("GBP");

    }

    else if (selectedCountry === "Other") {

      const typedCountry =

        otherCountryInput.value.trim();

      if (!typedCountry) {

        throw new Error("Please type your country.");

      }

      currencyCode =

        await findCurrencyForCountry(typedCountry);

      exchangeRate =

        await getExchangeRate(currencyCode);

      selectedCountry = typedCountry;

    }

    /* Save selection */

    localStorage.setItem(

      "squishyCountry",

      selectedCountry

    );

    localStorage.setItem(

      "squishyCurrency",

      currencyCode

    );

    localStorage.setItem(

      "squishyRate",

      exchangeRate

    );

    /* Show shop */

    countryScreen.style.display = "none";

    countryDisplay.textContent =

      `🌎 ${selectedCountry} • ${currencyCode}`;

    renderProducts();

  }

  catch(error) {

    console.error(error);

    countryError.textContent =

      error.message ||

      "We couldn't find the currency. Please try again.";

  }

  nextBtn.disabled = false;

  nextBtn.textContent = "NEXT →";

});

/* =========================

   FIND CURRENCY

========================= */

async function findCurrencyForCountry(country) {

  const clean =

    country.toLowerCase().trim();

  /* Check our list first */

  if (countryCurrencies[clean]) {

    return countryCurrencies[clean];

  }

  /*

    If it isn't in the list,

    ask the country database.

  */

  const response = await fetch(

    "https://restcountries.com/v3.1/name/" +

    encodeURIComponent(country) +

    "?fields=name,currencies"

  );

  if (!response.ok) {

    throw new Error(

      "I couldn't find that country. Please check the spelling."

    );

  }

  const data = await response.json();

  if (!data.length || !data[0].currencies) {

    throw new Error(

      "I couldn't find that country's currency."

    );

  }

  const currencies =

    Object.keys(data[0].currencies);

  if (!currencies.length) {

    throw new Error(

      "I couldn't find that country's currency."

    );

  }

  return currencies[0];

}

/* =========================

   EXCHANGE RATE

========================= */

async function getExchangeRate(currency) {

  if (currency === "USD") {

    return 1;

  }

  const response = await fetch(

    "https://open.er-api.com/v6/latest/USD"

  );

  if (!response.ok) {

    throw new Error(

      "Currency conversion is unavailable right now."

    );

  }

  const data = await response.json();

  if (

    !data.rates ||

    !data.rates[currency]

  ) {

    throw new Error(

      "That currency is not available right now."

    );

  }

  return Number(data.rates[currency]);

}

/* =========================

   PRICE FORMAT

========================= */

function convertedPrice(usdPrice) {

  return usdPrice * exchangeRate;

}

function formatMoney(usdPrice) {

  const amount =

    convertedPrice(usdPrice);

  try {

    return new Intl.NumberFormat(

      undefined,

      {

        style: "currency",

        currency: currencyCode

      }

    ).format(amount);

  }

  catch {

    return `${currencyCode} ${amount.toFixed(2)}`;

  }

}

/* =========================

   RENDER PRODUCTS

========================= */

const productsContainer =

  document.getElementById("products");

const loadingMessage =

  document.getElementById("loadingMessage");

function renderProducts() {

  loadingMessage.style.display = "none";

  productsContainer.innerHTML = "";

  products.forEach(product => {

    const card =

      document.createElement("div");

    card.className = "product";

    let pictureHTML = "";

    if (product.image) {

      pictureHTML = `

        <img

          src="${product.image}"

          alt="${product.name}"

          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"

        >

        <div

          class="emoji-image"

          style="display:none;"

        >

          🩷

        </div>

      `;

    }

    else {

      pictureHTML = `

        <div class="emoji-image">

          ${product.emoji}

        </div>

      `;

    }

    let colorsHTML = "";

    if (product.colors) {

      colorsHTML = `

        <div

          class="colors"

          id="colors-${product.id}"

        >

          ${product.colors.map(color => `

            <button

              type="button"

              class="color-btn"

              data-product="${product.id}"

              data-color="${color}"

            >

              ${color}

            </button>

          `).join("")}

        </div>

      `;

    }

    card.innerHTML = `

      ${pictureHTML}

      <h3>${product.name}</h3>

      <div class="price">

        ${formatMoney(product.price)}

      </div>

      ${colorsHTML}

      <button

        type="button"

        class="add-btn"

        data-add="${product.id}"

      >

        🛒 Add to Cart

      </button>

    `;

    productsContainer.appendChild(card);

  });

  /* Color buttons */

  document.querySelectorAll(".color-btn")

    .forEach(button => {

      button.addEventListener("click", () => {

        const productId =

          button.dataset.product;

        document

          .querySelectorAll(

            `.color-btn[data-product="${productId}"]`

          )

          .forEach(b =>

            b.classList.remove("selected")

          );

        button.classList.add("selected");

      });

    });

  /* Add buttons */

  document.querySelectorAll("[data-add]")

    .forEach(button => {

      button.addEventListener("click", () => {

        const productId =

          button.dataset.add;

        addToCart(productId);

      });

    });

}

/* =========================

   CART

========================= */

let cart = [];

try {

  const savedCart =

    localStorage.getItem("squishyCart");

  if (savedCart) {

    cart = JSON.parse(savedCart);

  }

}

catch {

  cart = [];

}

function saveCart() {

  localStorage.setItem(

    "squishyCart",

    JSON.stringify(cart)

  );

}

function addToCart(productId) {

  const product =

    products.find(p => p.id === productId);

  if (!product) return;

  let color = "";

  if (product.colors) {

    const selectedButton =

      document.querySelector(

        `.color-btn[data-product="${productId}"].selected`

      );

    if (!selectedButton) {

      alert(

        `Please choose a color for ${product.name}.`

      );

      return;

    }

    color =

      selectedButton.dataset.color;

  }

  const existing =

    cart.find(item =>

      item.productId === productId &&

      item.color === color

    );

  if (existing) {

    existing.quantity++;

  }

  else {

    cart.push({

      productId: productId,

      color: color,

      quantity: 1

    });

  }

  saveCart();

  renderCart();

  /* Open cart */

  document

    .getElementById("cartPanel")

    .classList.add("open");

}

/* =========================

   RENDER CART

========================= */

const cartItems =

  document.getElementById("cartItems");

const cartTotal =

  document.getElementById("cartTotal");

const cartCount =

  document.getElementById("cartCount");

function renderCart() {

  cartItems.innerHTML = "";

  let total = 0;

  let count = 0;

  if (!cart.length) {

    cartItems.innerHTML = `

      <div class="empty-cart">

        🛒 Your cart is empty.

      </div>

    `;

  }

  cart.forEach((item, index) => {

    const product =

      products.find(

        p => p.id === item.productId

      );

    if (!product) return;

    const itemTotal =

      product.price *

      item.quantity *

      exchangeRate;

    total += itemTotal;

    count += item.quantity;

    const div =

      document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <div class="cart-item-title">

        ${product.name}

      </div>

      ${

        item.color

          ? `<div>Color: ${item.color}</div>`

          : ""

      }

      <div>

        ${formatMoney(product.price)}

        each

      </div>

      <div class="cart-item-controls">

        <button

          class="qty-btn"

          data-minus="${index}"

        >

          −

        </button>

        <strong>

          ${item.quantity}

        </strong>

        <button

          class="qty-btn"

          data-plus="${index}"

        >

          +

        </button>

        <button

          class="remove-btn"

          data-remove="${index}"

        >

          Remove

        </button>

      </div>

      <div>

        <strong>

          ${formatMoney(

            product.price * item.quantity

          )}

        </strong>

      </div>

    `;

    cartItems.appendChild(div);

  });

  cartTotal.textContent =

    formatMoney(

      total / exchangeRate

    );

  cartCount.textContent = count;

  /* Minus */

  document

    .querySelectorAll("[data-minus]")

    .forEach(button => {

      button.addEventListener("click", () => {

        const index =

          Number(button.dataset.minus);

        cart[index].quantity--;

        if (cart[index].quantity <= 0) {

          cart.splice(index, 1);

        }

        saveCart();

        renderCart();

      });

    });

  /* Plus */

  document

    .querySelectorAll("[data-plus]")

    .forEach(button => {

      button.addEventListener("click", () => {

        const index =

          Number(button.dataset.plus);

        cart[index].quantity++;

        saveCart();

        renderCart();

      });

    });

  /* Remove */

  document

    .querySelectorAll("[data-remove]")

    .forEach(button => {

      button.addEventListener("click", () => {

        const index =

          Number(button.dataset.remove);

        cart.splice(index, 1);

        saveCart();

        renderCart();

      });

    });

}

/* =========================

   CART BUTTONS

========================= */

document

  .getElementById("cartBtn")

  .addEventListener("click", () => {

    document

      .getElementById("cartPanel")

      .classList.add("open");

  });

document

  .getElementById("closeCart")

  .addEventListener("click", () => {

    document

      .getElementById("cartPanel")

      .classList.remove("open");

  });

document

  .getElementById("clearCart")

  .addEventListener("click", () => {

    cart = [];

    saveCart();

    renderCart();

  });

/* =========================

   EMAIL ORDER

========================= */

document

  .getElementById("emailOrder")

  .addEventListener("click", () => {

    if (!cart.length) {

      alert("Your cart is empty!");

      return;

    }

    let message =

      `Hello Squishy Mart!%0D%0A%0D%0A`;

    message +=

      `I would like to order:%0D%0A%0D%0A`;

    let totalUSD = 0;

    cart.forEach(item => {

      const product =

        products.find(

          p => p.id === item.productId

        );

      if (!product) return;

      const itemUSD =

        product.price *

        item.quantity;

      totalUSD += itemUSD;

      message +=

        `${product.name}`;

      if (item.color) {

        message +=

          ` - ${item.color}`;

      }

      message +=

        ` x${item.quantity} = ` +

        `${formatMoney(itemUSD)}` +

        `%0D%0A`;

    });

    message += `%0D%0A`;

    message +=

      `Total: ${formatMoney(totalUSD)}%0D%0A`;

    message +=

      `Country: ${selectedCountry}%0D%0A`;

    message +=

      `Currency: ${currencyCode}%0D%0A%0D%0A`;

    message +=

      `Thank you! 🩷`;

    window.location.href =

      `mailto:${SHOP_EMAIL}` +

      `?subject=Squishy Mart Order` +

      `&body=${message}`;

  });

/* =========================

   COUNTRY BUTTON IN HEADER

========================= */

document

  .getElementById("countryBtn")

  .addEventListener("click", () => {

    countryScreen.style.display = "flex";

  });

/* =========================

   LOAD SAVED COUNTRY

========================= */

function loadSavedCountry() {

  const savedCountry =

    localStorage.getItem("squishyCountry");

  const savedCurrency =

    localStorage.getItem("squishyCurrency");

  const savedRate =

    localStorage.getItem("squishyRate");

  if (

    savedCountry &&

    savedCurrency &&

    savedRate

  ) {

    selectedCountry =

      savedCountry;

    currencyCode =

      savedCurrency;

    exchangeRate =

      Number(savedRate);

    countryDisplay.textContent =

      `🌎 ${selectedCountry} • ${currencyCode}`;

    countryScreen.style.display =

      "none";

  }

}

/* =========================

   START

========================= */

loadSavedCountry();

renderProducts();

renderCart();

</script>
