<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎀 Squishy Mart</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: linear-gradient(180deg, #ffe8f3, #fff8fc);

  color: #5a3b49;

}

/* ================= HEADER ================= */

header {

  background: #ff91c2;

  color: white;

  padding: 16px 18px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  position: sticky;

  top: 0;

  z-index: 20;

  box-shadow: 0 3px 12px #d56f9a33;

}

.logo {

  font-size: 23px;

  font-weight: bold;

}

/* CART BUTTON */

.cart-button {

  border: none;

  background: white;

  color: #e34f94;

  border-radius: 999px;

  padding: 10px 15px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

  position: relative;

}

.cart-count {

  position: absolute;

  top: -7px;

  right: -7px;

  width: 23px;

  height: 23px;

  background: #e64f94;

  color: white;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 12px;

}

/* ================= HERO ================= */

.hero {

  text-align: center;

  padding: 35px 18px 25px;

}

.hero-bow {

  font-size: 42px;

}

.hero h1 {

  margin: 5px 0;

  font-size: 34px;

  color: #e45297;

}

.hero p {

  margin: 8px 0;

  font-size: 16px;

  color: #7d5969;

}

.shop-button {

  display: inline-block;

  margin-top: 12px;

  padding: 13px 25px;

  background: #ff72b2;

  color: white;

  text-decoration: none;

  border-radius: 999px;

  font-weight: bold;

}

/* ================= SHOP ================= */

.shop {

  max-width: 1100px;

  margin: auto;

  padding: 10px 16px 50px;

}

.shop-title {

  text-align: center;

  color: #e45297;

  margin-bottom: 22px;

}

.grid {

  display: grid;

  grid-template-columns:

    repeat(auto-fit, minmax(170px, 1fr));

  gap: 16px;

}

/* ================= PRODUCT CARD ================= */

.product {

  background: white;

  border: 3px solid #ffd0e4;

  border-radius: 22px;

  padding: 12px;

  text-align: center;

  box-shadow:

    0 6px 18px #d98aaa20;

  transition: transform .15s;

}

.product:hover {

  transform: translateY(-4px);

}

.toy {

  height: 155px;

  border-radius: 17px;

  background: #fff0f7;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  cursor: pointer;

}

.toy img {

  width: 100%;

  height: 100%;

  object-fit: contain;

}

.toy span {

  font-size: 68px;

}

.product h3 {

  margin: 10px 3px 5px;

  font-size: 17px;

}

.product-price {

  color: #e34f94;

  font-size: 19px;

  font-weight: bold;

  margin-bottom: 9px;

}

/* ADD BUTTON */

.add-cart {

  width: 100%;

  border: none;

  background: #ff72b2;

  color: white;

  padding: 11px;

  border-radius: 999px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

}

.add-cart:active {

  transform: scale(.97);

}

/* ================= PRODUCT MODAL ================= */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background: #4b263766;

  z-index: 80;

  padding: 18px;

  align-items: center;

  justify-content: center;

}

.modal.open {

  display: flex;

}

.modal-box {

  width: min(520px, 100%);

  max-height: 92vh;

  overflow-y: auto;

  background: white;

  border-radius: 28px;

  padding: 20px;

  position: relative;

}

.close-modal {

  position: absolute;

  right: 12px;

  top: 10px;

  width: 42px;

  height: 42px;

  border: none;

  border-radius: 50%;

  background: #ffe0ed;

  font-size: 25px;

  cursor: pointer;

}

.modal-picture {

  height: 280px;

  background: #fff0f7;

  border-radius: 20px;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

}

.modal-picture img {

  width: 100%;

  height: 100%;

  object-fit: contain;

}

.modal-picture span {

  font-size: 110px;

}

.modal-box h2 {

  color: #e45297;

  margin: 15px 0 5px;

}

.modal-price {

  color: #e34f94;

  font-size: 23px;

  font-weight: bold;

}

.modal-description {

  color: #7d5969;

}

/* COLOURS */

.colors-title {

  font-weight: bold;

  margin-top: 15px;

}

.colors {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

}

.color-button {

  border: 2px solid #ffc3dc;

  background: white;

  color: #70495b;

  border-radius: 999px;

  padding: 9px 14px;

  cursor: pointer;

}

.color-button.selected {

  background: #ff91c2;

  color: white;

}

/* MODAL ADD */

.modal-add {

  width: 100%;

  border: none;

  background: #ff72b2;

  color: white;

  padding: 14px;

  border-radius: 999px;

  font-size: 16px;

  font-weight: bold;

  margin-top: 17px;

  cursor: pointer;

}

/* ================= CART ================= */

.cart-overlay {

  display: none;

  position: fixed;

  inset: 0;

  background: #4b263766;

  z-index: 100;

}

.cart-overlay.open {

  display: block;

}

.cart-panel {

  position: absolute;

  right: 0;

  top: 0;

  width: min(430px, 100%);

  height: 100%;

  background: white;

  padding: 20px;

  overflow-y: auto;

}

.cart-header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  border-bottom: 2px solid #ffd1e4;

  padding-bottom: 12px;

}

.cart-header h2 {

  margin: 0;

  color: #e45297;

}

.close-cart {

  border: none;

  background: #ffe0ed;

  width: 40px;

  height: 40px;

  border-radius: 50%;

  font-size: 23px;

  cursor: pointer;

}

/* CART ITEMS */

.cart-item {

  display: flex;

  gap: 12px;

  padding: 15px 0;

  border-bottom: 1px solid #ffdce9;

}

.cart-image {

  width: 78px;

  height: 78px;

  flex-shrink: 0;

  background: #fff0f7;

  border-radius: 15px;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

}

.cart-image img {

  width: 100%;

  height: 100%;

  object-fit: contain;

}

.cart-image span {

  font-size: 38px;

}

.cart-info {

  flex: 1;

}

.cart-info h3 {

  margin: 0 0 5px;

  font-size: 16px;

}

.cart-info p {

  margin: 3px 0;

  color: #8a6877;

  font-size: 13px;

}

.quantity {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 8px;

}

.quantity button {

  border: none;

  width: 30px;

  height: 30px;

  border-radius: 50%;

  background: #ffe0ed;

  color: #e34f94;

  font-size: 18px;

  cursor: pointer;

}

.remove {

  border: none;

  background: none;

  color: #d96c91;

  padding: 0;

  margin-top: 6px;

  cursor: pointer;

}

/* TOTAL */

.cart-total {

  display: flex;

  justify-content: space-between;

  margin-top: 20px;

  padding-top: 15px;

  border-top: 3px solid #ffd0e3;

  color: #e34f94;

  font-size: 21px;

  font-weight: bold;

}

.order-cart {

  display: block;

  width: 100%;

  margin-top: 18px;

  padding: 15px;

  border: none;

  border-radius: 999px;

  background: #ff72b2;

  color: white;

  text-align: center;

  text-decoration: none;

  font-size: 16px;

  font-weight: bold;

}

.clear-cart {

  width: 100%;

  margin-top: 9px;

  padding: 11px;

  border: 2px solid #ffc3dc;

  background: white;

  color: #d96c91;

  border-radius: 999px;

  cursor: pointer;

}

.empty {

  text-align: center;

  padding: 55px 10px;

  color: #9a7182;

  font-size: 18px;

}

/* ================= FOOTER ================= */

footer {

  background: #ffd8e9;

  text-align: center;

  padding: 25px;

  color: #7d5969;

}

/* ================= PHONE ================= */

@media (max-width: 500px) {

  .logo {

    font-size: 19px;

  }

  .cart-button {

    font-size: 14px;

  }

  .grid {

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 10px;

  }

  .toy {

    height: 125px;

  }

  .toy span {

    font-size: 55px;

  }

  .product h3 {

    font-size: 14px;

  }

  .product-price {

    font-size: 17px;

  }

  .add-cart {

    font-size: 12px;

    padding: 9px;

  }

  .modal-picture {

    height: 230px;

  }

}

</style>

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="logo">

    🎀 Squishy Mart

  </div>

  <button

    class="cart-button"

    id="cartButton"

  >

    🛒 Cart

    <span

      class="cart-count"

      id="cartCount"

    >

      0

    </span>

  </button>

</header>

<!-- ================= HERO ================= -->

<section class="hero">

  <div class="hero-bow">

    🎀

  </div>

  <h1>

    Squishy Mart

  </h1>

  <p>

    Soft, cute & satisfying squishies 💕

  </p>

  <a

    href="#shop"

    class="shop-button"

  >

    Shop now ✨

  </a>

</section>

<!-- ================= SHOP ================= -->

<main

  class="shop"

  id="shop"

>

  <h2 class="shop-title">

    Our Squishies 🧸💕

  </h2>

  <div

    id="products"

    class="grid"

  ></div>

</main>

<!-- ================= PRODUCT MODAL ================= -->

<div

  class="modal"

  id="productModal"

>

  <div class="modal-box">

    <button

      class="close-modal"

      id="closeModal"

    >

      ×

    </button>

    <div

      class="modal-picture"

      id="modalPicture"

    ></div>

    <h2

      id="modalName"

    ></h2>

    <div

      class="modal-price"

      id="modalPrice"

    ></div>

    <p

      class="modal-description"

      id="modalDescription"

    ></p>

    <div

      id="colorArea"

    ></div>

    <button

      class="modal-add"

      id="modalAdd"

    >

      🛒 Add to Cart

    </button>

  </div>

</div>

<!-- ================= CART ================= -->

<div

  class="cart-overlay"

  id="cartOverlay"

>

  <div class="cart-panel">

    <div class="cart-header">

      <h2>

        🛒 Your Cart

      </h2>

      <button

        class="close-cart"

        id="closeCart"

      >

        ×

      </button>

    </div>

    <div

      id="cartItems"

    ></div>

    <div

      id="cartBottom"

      style="display:none;"

    >

      <div class="cart-total">

        <span>

          Total

        </span>

        <span id="cartTotal">

          $0

        </span>

      </div>

      <a

        id="orderCart"

        class="order-cart"

        href="#"

      >

        💌 Order Cart by Email

      </a>

      <button

        class="clear-cart"

        id="clearCart"

      >

        🗑️ Clear Cart

      </button>

    </div>

  </div>

</div>

<!-- ================= FOOTER ================= -->

<footer>

  Made with 💗 for squishy lovers

</footer>

<script>

/* ================= PRODUCTS ================= */

const products = [

  {

    name: "Slow Rise Butter",

    price: 6,

    emoji: "🧈",

    image: "IMG_1103.jpeg",

    description: "A soft and satisfying slow-rise butter squishy."

  },

  {

    name: "Vaseline Butter",

    price: 6,

    emoji: "🧈",

    image: "IMG_1096.jpeg",

    description: "A cute buttery squishy."

  },

  {

    name: "Crunchy Butter",

    price: 6,

    emoji: "🧈",

    image: "IMG_1091.jpeg",

    description: "A crunchy butter squishy.",

    colors: ["Blue", "Pink"]

  },

  {

    name: "Cheese",

    price: 6,

    emoji: "🧀",

    image: "IMG_1098.jpeg",

    description: "A cute cheesy squishy."

  },

  {

    name: "Potato",

    price: 6,

    emoji: "🥔",

    image: "IMG_1101.jpeg",

    description: "A soft potato squishy."

  },

  {

    name: "Peach",

    price: 6,

    emoji: "🍑",

    image: "IMG_1093.jpeg",

    description: "A cute soft peach squishy."

  },

  {

    name: "Crunchy Toast",

    price: 6,

    emoji: "🍞",

    image: "IMG_1095.jpeg",

    description: "A crunchy-looking toast squishy."

  },

  {

    name: "Needoh Cloud",

    price: 8,

    emoji: "☁️",

    image: null,

    description: "A soft and fluffy cloud squishy."

  },

  {

    name: "Giant Strawberry",

    price: 9,

    emoji: "🍓",

    image: "IMG_1094.jpeg",

    description: "A giant strawberry squishy."

  },

  {

    name: "Slushy Apple",

    price: 6,

    emoji: "🍏",

    image: "IMG_1100.jpeg",

    description: "Choose your apple colour.",

    colors: ["Red", "Green"]

  },

  {

    name: "Duck",

    price: 6,

    emoji: "🦆",

    image: "IMG_1090.jpeg",

    description: "A cute duck squishy.",

    colors: [

      "Pink",

      "Blue",

      "Orange",

      "Purple"

    ]

  },

  {

    name: "Crunchy Soap",

    price: 6,

    emoji: "🧼",

    image: "IMG_1102.jpeg",

    description: "A cute crunchy soap squishy."

  },

  {

    name: "Needoh",

    price: 8,

    emoji: "🌈",

    image: null,

    description: "A soft and satisfying Needoh-style squishy."

  },

  {

    name: "Needoh Jellyfish",

    price: 8,

    emoji: "🪼",

    image: null,

    description: "A cute jellyfish squishy."

  },

  {

    name: "Needoh Cake",

    price: 8,

    emoji: "🍰",

    image: null,

    description: "A sweet cake-shaped squishy."

  },

  {

    name: "Needoh Ice Cream",

    price: 8,

    emoji: "🍦",

    image: null,

    description: "A cute ice cream squishy."

  },

  {

    name: "Bear",

    price: 3,

    emoji: "🐻",

    image: "IMG_1092.jpeg",

    description: "A cute glittery bear squishy.",

    colors: [

      "Pink",

      "Blue",

      "Orange",

      "Purple"

    ]

  }

];

/* ================= VARIABLES ================= */

let cart = [];

let selectedProduct = 0;

let selectedColor = "";

/* ================= ELEMENTS ================= */

const productsBox =

  document.getElementById("products");

const productModal =

  document.getElementById("productModal");

const modalPicture =

  document.getElementById("modalPicture");

const modalName =

  document.getElementById("modalName");

const modalPrice =

  document.getElementById("modalPrice");

const modalDescription =

  document.getElementById("modalDescription");

const colorArea =

  document.getElementById("colorArea");

const modalAdd =

  document.getElementById("modalAdd");

const closeModal =

  document.getElementById("closeModal");

const cartButton =

  document.getElementById("cartButton");

const cartCount =

  document.getElementById("cartCount");

const cartOverlay =

  document.getElementById("cartOverlay");

const closeCart =

  document.getElementById("closeCart");

const cartItems =

  document.getElementById("cartItems");

const cartBottom =

  document.getElementById("cartBottom");

const cartTotal =

  document.getElementById("cartTotal");

const orderCart =

  document.getElementById("orderCart");

const clearCart =

  document.getElementById("clearCart");

/* ================= SHOW PRODUCTS ================= */

function renderProducts() {

  productsBox.innerHTML = "";

  products.forEach(function(product, index) {

    const card =

      document.createElement("article");

    card.className = "product";

    let picture;

    if (product.image) {

      picture =

        '<img src="' +

        product.image +

        '" alt="' +

        product.name +

        '">';

    } else {

      picture =

        "<span>" +

        product.emoji +

        "</span>";

    }

    card.innerHTML =

      '<div class="toy">' +

      picture +

      "</div>" +

      "<h3>" +

      product.name +

      "</h3>" +

      '<div class="product-price">$' +

      product.price +

      "</div>" +

      '<button class="add-cart">' +

      "🛒 Add to Cart" +

      "</button>";

    const pictureBox =

      card.querySelector(".toy");

    const addButton =

      card.querySelector(".add-cart");

    pictureBox.addEventListener(

      "click",

      function() {

        openProduct(index);

      }

    );

    addButton.addEventListener(

      "click",

      function() {

        addToCart(index);

      }

    );

    productsBox.appendChild(card);

  });

}

/* ================= OPEN PRODUCT ================= */

function openProduct(index) {

  selectedProduct = index;

  selectedColor = "";

  const product =

    products[index];

  if (product.image) {

    modalPicture.innerHTML =

      '<img src="' +

      product.image +

      '" alt="' +

      product.name +

      '">';

  } else {

    modalPicture.innerHTML =

      "<span>" +

      product.emoji +

      "</span>";

  }

  modalName.textContent =

    product.name;

  modalPrice.textContent =

    "$" + product.price;

  modalDescription.textContent =

    product.description;

  colorArea.innerHTML = "";

  if (product.colors) {

    const title =

      document.createElement("div");

    title.className =

      "colors-title";

    title.textContent =

      "Choose a colour:";

    const colors =

      document.createElement("div");

    colors.className =

      "colors";

    product.colors.forEach(

      function(color) {

        const button =

          document.createElement("button");

        button.className =

          "color-button";

        button.textContent =

          color;

        button.addEventListener(

          "click",

          function() {

            selectedColor =

              color;

            colors

              .querySelectorAll(

                ".color-button"

              )

              .forEach(

                function(item) {

                  item.classList.remove(

                    "selected"

                  );

                }

              );

            button.classList.add(

              "selected"

            );

          }

        );

        colors.appendChild(button);

      }

    );

    colorArea.appendChild(title);

    colorArea.appendChild(colors);

  }

  productModal.classList.add(

    "open"

  );

}

/* ================= CLOSE PRODUCT ================= */

closeModal.addEventListener(

  "click",

  function() {

    productModal.classList.remove(

      "open"

    );

  }

);

productModal.addEventListener(

  "click",

  function(event) {

    if (

      event.target === productModal

    ) {

      productModal.classList.remove(

        "open"

      );

    }

  }

);

/* ================= ADD TO CART ================= */

function addToCart(index) {

  const product =

    products[index];

  let existing =

    cart.find(

      function(item) {

        return (

          item.index === index &&

          item.color === selectedColor

        );

      }

    );

  if (existing) {

    existing.quantity++;

  } else {

    cart.push({

      index: index,

      color: selectedColor,

      quantity: 1

    });

  }

  updateCart();

  productModal.classList.remove(

    "open"

  );

}

/* ================= CART ================= */

function updateCart() {

  let count = 0;

  let total = 0;

  cart.forEach(

    function(item) {

      const product =

        products[item.index];

      count +=

        item.quantity;

      total +=

        product.price *

        item.quantity;

    }

  );

  cartCount.textContent =

    count;

  cartItems.innerHTML = "";

  if (cart.length === 0) {

    cartItems.innerHTML =

      '<div class="empty">' +

      "🛒 Your cart is empty!" +

      "<br><br>" +

      "Add some cute squishies 💕" +

      "</div>";

    cartBottom.style.display =

      "none";

    return;

  }

  cartBottom.style.display =

    "block";

  cart.forEach(

    function(item, cartIndex) {

      const product =

        products[item.index];

      const row =

        document.createElement(

          "div"

        );

      row.className =

        "cart-item";

      let picture;

      if (product.image) {

        picture =

          '<img src="' +

          product.image +

          '" alt="' +

          product.name +

          '">';

      } else {

        picture =

          "<span>" +

          product.emoji +

          "</span>";

      }

      let colourText = "";

      if (item.color) {

        colourText =

          "<p>Colour: " +

          item.color +

          "</p>";

      }

      row.innerHTML =

        '<div class="cart-image">' +

        picture +

        "</div>" +

        '<div class="cart-info">' +

        "<h3>" +

        product.name +

        "</h3>" +

        "<p>$" +

        product.price +

        " each</p>" +

        colourText +

        '<div class="quantity">' +

        '<button class="minus">−</button>' +

        "<strong>" +

        item.quantity +

        "</strong>" +

        '<button class="plus">+</button>' +

        "</div>" +

        '<button class="remove">' +

        "Remove" +

        "</button>" +

        "</div>";

      row

        .querySelector(".minus")

        .addEventListener(

          "click",

          function() {

            changeQuantity(

              cartIndex,

              -1

            );

          }

        );

      row

        .querySelector(".plus")

        .addEventListener(

          "click",

          function() {

            changeQuantity(

              cartIndex,

              1

            );

          }

        );

      row

        .querySelector(".remove")

        .addEventListener(

          "click",

          function() {

            cart.splice(

              cartIndex,

              1

            );

            updateCart();

          }

        );

      cartItems.appendChild(row);

    }

  );

  cartTotal.textContent =

    "$" + total;

  updateOrderLink();

}

/* ================= QUANTITY ================= */

function changeQuantity(

  cartIndex,

  amount

) {

  cart[cartIndex].quantity +=

    amount;

  if (

    cart[cartIndex].quantity <= 0

  ) {

    cart.splice(

      cartIndex,

      1

    );

  }

  updateCart();

}

/* ================= EMAIL ORDER ================= */

function updateOrderLink() {

  let body =

    "Hi! I would like to order:%0A%0A";

  let total = 0;

  cart.forEach(

    function(item) {

      const product =

        products[item.index];

      const subtotal =

        product.price *

        item.quantity;

      total +=

        subtotal;

      body +=

        item.quantity +

        " x " +

        product.name;

      if (item.color) {

        body +=

          " (" +

          item.color +

          ")";

      }

      body +=

        " - $" +

        subtotal +

        "%0A";

    }

  );

  body +=

    "%0ATotal: $" +

    total;

  orderCart.href =

    "mailto:squishy.mart2026@gmail.com" +

    "?subject=Squishy%20Mart%20Order" +

    "&body=" +

    body;

}

/* ================= MODAL ADD BUTTON ================= */

modalAdd.addEventListener(

  "click",

  function() {

    addToCart(

      selectedProduct

    );

  }

);

/* ================= OPEN CART ================= */

cartButton.addEventListener(

  "click",

  function() {

    updateCart();

    cartOverlay.classList.add(

      "open"

    );

  }

);

/* ================= CLOSE CART ================= */

closeCart.addEventListener(

  "click",

  function() {

    cartOverlay.classList.remove(

      "open"

    );

  }

);

/* CLOSE CART OUTSIDE */

cartOverlay.addEventListener(

  "click",

  function(event) {

    if (

      event.target === cartOverlay

    ) {

      cartOverlay.classList.remove(

        "open"

      );

    }

  }

);

/* ================= CLEAR CART ================= */

clearCart.addEventListener(

  "click",

  function() {

    cart = [];

    updateCart();

  }

);

/* ================= START ================= */

renderProducts();

updateCart();

</script>
