 <!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Squishy Mart 💗</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #ffe4f1;

  color: #333;

}

header {

  background: #ff8fc4;

  padding: 15px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 8px;

  position: sticky;

  top: 0;

  z-index: 20;

}

.logo {

  color: white;

  font-size: 22px;

  font-weight: bold;

}

.header-buttons {

  display: flex;

  gap: 6px;

}

button {

  border: 0;

  border-radius: 12px;

  padding: 10px 14px;

  font-size: 15px;

  cursor: pointer;

}

.header-btn {

  background: white;

  color: #ff5ca8;

}

.hero {

  text-align: center;

  padding: 25px 15px 10px;

}

.hero h1 {

  color: #ff4f9a;

  margin-bottom: 5px;

}

.hero p {

  margin-top: 5px;

}

.products {

  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));

  gap: 15px;

  padding: 20px;

  max-width: 1100px;

  margin: auto;

}

.product {

  background: white;

  border-radius: 20px;

  padding: 12px;

  text-align: center;

  box-shadow: 0 3px 10px rgba(255, 100, 160, 0.15);

}

.product img {

  width: 100%;

  height: 170px;

  object-fit: contain;

  border-radius: 15px;

}

.emoji-image {

  height: 170px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 85px;

}

.product h3 {

  margin: 8px 0 5px;

  font-size: 17px;

}

.price {

  color: #ff4f9a;

  font-weight: bold;

  margin-bottom: 8px;

}

.product button,

.primary {

  background: #ff79b7;

  color: white;

  width: 100%;

}

.overlay {

  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0,0,0,.45);

  z-index: 50;

  align-items: center;

  justify-content: center;

  padding: 15px;

}

.modal {

  background: white;

  width: 100%;

  max-width: 430px;

  max-height: 90vh;

  overflow-y: auto;

  border-radius: 25px;

  padding: 20px;

}

.modal h2 {

  color: #ff4f9a;

  text-align: center;

}

.close {

  float: right;

  background: #ffe4f1;

  color: #ff4f9a;

}

.color-buttons {

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  margin: 10px 0 15px;

}

.color-btn {

  background: #ffe4f1;

  color: #ff4f9a;

}

.color-btn.selected {

  background: #ff79b7;

  color: white;

}

.cart-item {

  background: #fff0f7;

  border-radius: 15px;

  padding: 10px;

  margin: 8px 0;

}

.quantity {

  display: flex;

  align-items: center;

  gap: 8px;

  margin-top: 8px;

}

.quantity button {

  background: #ffb4d5;

  color: white;

}

.total {

  font-size: 20px;

  font-weight: bold;

  color: #ff4f9a;

  text-align: right;

  margin: 15px 0;

}

.country-screen {

  position: fixed;

  inset: 0;

  background: #ffe4f1;

  z-index: 100;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.country-box {

  background: white;

  width: 100%;

  max-width: 420px;

  border-radius: 25px;

  padding: 25px;

  text-align: center;

}

.country-box h1 {

  color: #ff4f9a;

}

.country-option {

  display: block;

  width: 100%;

  margin: 9px 0;

  background: #ff9bc9;

  color: white;

}

.other-input {

  display: none;

  width: 100%;

  padding: 12px;

  border: 2px solid #ffb4d5;

  border-radius: 12px;

  margin-top: 10px;

  font-size: 16px;

}

.address-input {

  width: 100%;

  min-height: 100px;

  border: 2px solid #ffb4d5;

  border-radius: 12px;

  padding: 12px;

  font-size: 16px;

  resize: vertical;

}

.message {

  color: #e53970;

  font-size: 14px;

  margin: 8px 0;

}

@media (max-width: 500px) {

  header {

    flex-wrap: wrap;

  }

  .logo {

    width: 100%;

    text-align: center;

  }

  .header-buttons {

    width: 100%;

    justify-content: center;

  }

  .products {

    grid-template-columns: repeat(2, 1fr);

    padding: 12px;

    gap: 10px;

  }

  .product img,

  .emoji-image {

    height: 130px;

  }

  .emoji-image {

    font-size: 65px;

  }

}

</style>

</head>

<body>

<header>

  <div class="logo">Squishy Mart 💗</div>

  <div class="header-buttons">

    <button class="header-btn" id="countryBtn">Country</button>

    <button class="header-btn" id="cartBtn">Cart (0)</button>

  </div>

</header>

<section class="hero">

  <h1>Welcome to Squishy Mart! 🧸</h1>

  <p>Pick your favourite squishy! 💕</p>

  <p id="currencyText"></p>

</section>

<main class="products" id="products"></main>

<!-- COUNTRY -->

<div class="country-screen" id="countryScreen">

  <div class="country-box">

    <h1>Choose Your Country 🌎</h1>

    <p>Prices will automatically use your country's currency.</p>

    <button class="country-option" data-country="USA">

      🇺🇸 USA — USD

    </button>

    <button class="country-option" data-country="Singapore">

      🇸🇬 Singapore — SGD

    </button>

    <button class="country-option" data-country="Thailand">

      🇹🇭 Thailand — THB

    </button>

    <button class="country-option" data-country="UK">

      🇬🇧 UK — GBP

    </button>

    <button class="country-option" data-country="Other">

      🌎 Other Country

    </button>

    <input

      class="other-input"

      id="otherCountry"

      placeholder="Type your country"

    >

    <button

      class="primary"

      id="continueCountry"

      style="margin-top:12px;"

    >

      NEXT 💕

    </button>

    <p class="message" id="countryMessage"></p>

  </div>

</div>

<!-- PRODUCT MODAL -->

<div class="overlay" id="productOverlay">

  <div class="modal">

    <button class="close" id="closeProduct">✕</button>

    <h2 id="productName"></h2>

    <div id="productImage"></div>

    <p class="price" id="productPrice"></p>

    <div id="colorArea"></div>

    <button class="primary" id="addToCart">

      Add to Cart 💗

    </button>

  </div>

</div>

<!-- CART -->

<div class="overlay" id="cartOverlay">

  <div class="modal">

    <button class="close" id="closeCart">✕</button>

    <h2>Your Cart 🛒</h2>

    <div id="cartItems"></div>

    <div class="total" id="cartTotal"></div>

    <button class="primary" id="checkoutBtn">

      Order & Pay 💳

    </button>

    <button

      class="header-btn"

      id="clearCart"

      style="width:100%;margin-top:8px;"

    >

      Clear Cart

    </button>

  </div>

</div>

<!-- ADDRESS -->

<div class="overlay" id="addressOverlay">

  <div class="modal">

    <button class="close" id="closeAddress">✕</button>

    <h2>Delivery Address 📦</h2>

    <p>Please enter the address where you want your squishies delivered.</p>

    <textarea

      class="address-input"

      id="addressInput"

      placeholder="Enter your full delivery address"

    ></textarea>

    <p class="message" id="addressMessage"></p>

    <button class="primary" id="continuePayment">

      Continue to Payment 💳

    </button>

  </div>

</div>

<script>

const products = [
{

    id: "coconut-oil-ball",

    name: "Coconut Oil Ball",

    price: 5,

    colors: ["Pink", "Yellow", "Blue", "Green"]

  },

  {

    id: "hamster-taba",

    name: "Hamster Taba",

    price: 6,

    colors: ["Yellow", "White"]

  },

  {

    id: "souffle-taba",

    name: "Soufflé Taba",

    price: 7

  }

];
  {

    id: "slow-rise-butter",

    name: "Slow Rise Butter",

    price: 6,

    image: "IMG_1103.jpeg"

  },

  {

    id: "vaseline-butter",

    name: "Vaseline Butter",

    price: 6,

    image: "IMG_1096.jpeg"

  },

  {

    id: "crunchy-butter",

    name: "Crunchy Butter",

    price: 6,

    image: "IMG_1091.jpeg",

    colors: ["Blue", "Pink"]

  },

  {

    id: "cheese",

    name: "Cheese",

    price: 4,

    image: "IMG_1098.jpeg"

  },

  {

    id: "potato",

    name: "Potato",

    price: 6,

    image: "IMG_1101.jpeg"

  },

  {

    id: "peach",

    name: "Peach",

    price: 9,

    image: "IMG_1093.jpeg"

  },

  {

    id: "crunchy-toast",

    name: "Crunchy Toast",

    price: 6,

    image: "IMG_1095.jpeg"

  },

  {

    id: "needoh-cloud",

    name: "Needoh Cloud",

    price: 8,

    emoji: "☁️"

  },

  {

    id: "giant-strawberry",

    name: "Giant Strawberry",

    price: 9,

    image: "IMG_1094.jpeg"

  },

  {

    id: "slushy-apple",

    name: "Slushy Apple",

    price: 6,

    image: "IMG_1100.jpeg",

    colors: ["Red", "Green"]

  },

  {

    id: "duck",

    name: "Duck",

    price: 6,

    image: "IMG_1090.jpeg",

    colors: ["Pink", "Blue", "Orange", "Purple"]

  },

  {

    id: "crunchy-soap",

    name: "Crunchy Soap",

    price: 6,

    image: "IMG_1102.jpeg"

  },

  {

    id: "needoh",

    name: "Needoh",

    price: 8,

    emoji: "🌈",

    colors: ["Blue", "Pink", "Purple"]

  },

  {

    id: "needoh-jellyfish",

    name: "Needoh Jellyfish",

    price: 8,

    emoji: "🪼",

    colors: ["Blue", "Pink", "Purple"]

  },

  {

    id: "needoh-cake",

    name: "Needoh Cake",

    price: 8,

    emoji: "🍰"

  },

  {

    id: "needoh-ice-cream",

    name: "Needoh Ice Cream",

    price: 8,

    emoji: "🍦",

    colors: ["Blue", "Pink", "Orange"]

  },

  {

    id: "bear",

    name: "Bear",

    price: 3,

    image: "IMG_1092.jpeg",

    colors: ["Pink", "Blue", "Orange", "Purple"]

  }

];

let selectedCountry = localStorage.getItem("country") || "";

let selectedCurrency = localStorage.getItem("currency") || "";

let currencySymbol = localStorage.getItem("currencySymbol") || "";

let cart = JSON.parse(localStorage.getItem("squishyCart") || "[]");

let selectedProduct = null;

let selectedColor = null;

const rates = {

  USD: 1,

  SGD: 1,

  THB: 32.5,

  GBP: 0.74

};

const currencySymbols = {

  USD: "$",

  SGD: "S$",

  THB: "฿",

  GBP: "£"

};

function saveCart() {

  localStorage.setItem("squishyCart", JSON.stringify(cart));

}

function getPrice(product) {

  if (selectedCurrency === "SGD") {

    return product.price;

  }

  const rate = rates[selectedCurrency] || 1;

  return product.price * rate;

}

function formatPrice(amount) {

  if (selectedCurrency === "THB") {

    return currencySymbol + Math.round(amount);

  }

  if (selectedCurrency === "JPY" ||

      selectedCurrency === "KRW" ||

      selectedCurrency === "VND") {

    return currencySymbol + Math.round(amount);

  }

  return currencySymbol + amount.toFixed(2);

}

function renderProducts() {

  const container = document.getElementById("products");

  container.innerHTML = "";

  products.forEach(product => {

    const card = document.createElement("div");

    card.className = "product";

    let visual = "";

    if (product.image) {

      visual = `

        <img

          src="${product.image}"

          alt="${product.name}"

          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"

        >

        <div class="emoji-image" style="display:none;">🧸</div>

      `;

    } else {

      visual = `

        <div class="emoji-image">

          ${product.emoji}

        </div>

      `;

    }

    card.innerHTML = `

      ${visual}

      <h3>${product.name}</h3>

      <div class="price">${formatPrice(getPrice(product))}</div>

      <button>View 💗</button>

    `;

    card.addEventListener("click", () => {

      openProduct(product);

    });

    container.appendChild(card);

  });

}

function openProduct(product) {

  selectedProduct = product;

  selectedColor = null;

  document.getElementById("productName").textContent = product.name;

  document.getElementById("productPrice").textContent =

    formatPrice(getPrice(product));

  const imageBox = document.getElementById("productImage");

  if (product.image) {

    imageBox.innerHTML = `

      <img

        src="${product.image}"

        style="width:100%;height:220px;object-fit:contain;border-radius:15px;"

      >

    `;

  } else {

    imageBox.innerHTML = `

      <div class="emoji-image" style="height:220px;">

        ${product.emoji}

      </div>

    `;

  }

  const colorArea = document.getElementById("colorArea");

  if (product.colors && product.colors.length) {

    colorArea.innerHTML = `

      <p><b>Choose a color:</b></p>

      <div class="color-buttons">

        ${product.colors.map(color => `

          <button

            class="color-btn"

            data-color="${color}"

          >

            ${color}

          </button>

        `).join("")}

      </div>

    `;

    colorArea.querySelectorAll(".color-btn").forEach(button => {

      button.addEventListener("click", () => {

        selectedColor = button.dataset.color;

        colorArea.querySelectorAll(".color-btn")

          .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");

      });

    });

  } else {

    colorArea.innerHTML = "";

  }

  document.getElementById("productOverlay").style.display = "flex";

}

function addSelectedToCart() {

  if (!selectedProduct) return;

  if (

    selectedProduct.colors &&

    selectedProduct.colors.length &&

    !selectedColor

  ) {

    alert("Please choose a color first 💗");

    return;

  }

  const existing = cart.find(item =>

    item.productId === selectedProduct.id &&

    item.color === (selectedColor || "")

  );

  if (existing) {

    existing.quantity++;

  } else {

    cart.push({

      productId: selectedProduct.id,

      color: selectedColor || "",

      quantity: 1

    });

  }

  saveCart();

  updateCartButton();

  document.getElementById("productOverlay").style.display = "none";

}

function updateCartButton() {

  const count = cart.reduce(

    (total, item) => total + item.quantity,

    0

  );

  document.getElementById("cartBtn").textContent =

    `Cart (${count})`;

}

function renderCart() {

  const container = document.getElementById("cartItems");

  if (!cart.length) {

    container.innerHTML = "<p>Your cart is empty 💕</p>";

    document.getElementById("cartTotal").textContent =

      formatPrice(0);

    return;

  }

  let total = 0;

  container.innerHTML = "";

  cart.forEach((item, index) => {

    const product = products.find(

      p => p.id === item.productId

    );

    if (!product) return;

    const itemTotal =

      getPrice(product) * item.quantity;

    total += itemTotal;

    const div = document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <b>${product.name}</b>

      ${item.color ? `<div>Color: ${item.color}</div>` : ""}

      <div>${formatPrice(getPrice(product))} each</div>

      <div class="quantity">

        <button data-action="minus">−</button>

        <span>${item.quantity}</span>

        <button data-action="plus">+</button>

        <button data-action="remove"

          style="margin-left:auto;background:#ff79b7;color:white;">

          Remove

        </button>

      </div>

    `;

    div.querySelector('[data-action="minus"]')

      .addEventListener("click", () => {

        if (item.quantity > 1) {

          item.quantity--;

        } else {

          cart.splice(index, 1);

        }

        saveCart();

        updateCartButton();

        renderCart();

      });

    div.querySelector('[data-action="plus"]')

      .addEventListener("click", () => {

        item.quantity++;

        saveCart();

        updateCartButton();

        renderCart();

      });

    div.querySelector('[data-action="remove"]')

      .addEventListener("click", () => {

        cart.splice(index, 1);

        saveCart();

        updateCartButton();

        renderCart();

      });

    container.appendChild(div);

  });

  document.getElementById("cartTotal").textContent =

    "Total: " + formatPrice(total);

}

function showCountryScreen() {

  document.getElementById("countryScreen").style.display = "flex";

}

function hideCountryScreen() {

  document.getElementById("countryScreen").style.display = "none";

}

function setCountry(country) {

  selectedCountry = country;

  if (country === "USA") {

    selectedCurrency = "USD";

    currencySymbol = "$";

  }

  if (country === "Singapore") {

    selectedCurrency = "SGD";

    currencySymbol = "S$";

  }

  if (country === "Thailand") {

    selectedCurrency = "THB";

    currencySymbol = "฿";

  }

  if (country === "UK") {

    selectedCurrency = "GBP";

    currencySymbol = "£";

  }

}

document.querySelectorAll(".country-option")

  .forEach(button => {

    button.addEventListener("click", () => {

      const country = button.dataset.country;

      document

        .querySelectorAll(".country-option")

        .forEach(b => b.style.outline = "none");

      button.style.outline = "3px solid #ff4f9a";

      if (country === "Other") {

        document.getElementById("otherCountry").style.display = "block";

      } else {

        document.getElementById("otherCountry").style.display = "none";

        setCountry(country);

      }

    });

  });

document.getElementById("continueCountry")

  .addEventListener("click", () => {

    const other = document

      .getElementById("otherCountry")

      .value

      .trim();

    if (selectedCountry === "Other") {

      if (!other) {

        document.getElementById("countryMessage").textContent =

          "Please type your country.";

        return;

      }

      /*

       * Common country currency choices.

       * The Stripe backend also handles the final currency.

       */

      const lower = other.toLowerCase();

      if (lower.includes("japan")) {

        selectedCurrency = "JPY";

        currencySymbol = "¥";

      } else if (lower.includes("korea")) {

        selectedCurrency = "KRW";

        currencySymbol = "₩";

      } else if (lower.includes("china")) {

        selectedCurrency = "CNY";

        currencySymbol = "¥";

      } else if (lower.includes("malaysia")) {

        selectedCurrency = "MYR";

        currencySymbol = "RM";

      } else if (lower.includes("australia")) {

        selectedCurrency = "AUD";

        currencySymbol = "A$";

      } else if (lower.includes("canada")) {

        selectedCurrency = "CAD";

        currencySymbol = "C$";

      } else if (lower.includes("europe") ||

                 lower.includes("france") ||

                 lower.includes("germany")) {

        selectedCurrency = "EUR";

        currencySymbol = "€";

      } else {

        selectedCurrency = "USD";

        currencySymbol = "$";

      }

      selectedCountry = other;

    }

    if (!selectedCountry || !selectedCurrency) {

      document.getElementById("countryMessage").textContent =

        "Please choose a country first.";

      return;

    }

    localStorage.setItem("country", selectedCountry);

    localStorage.setItem("currency", selectedCurrency);

    localStorage.setItem("currencySymbol", currencySymbol);

    document.getElementById("currencyText").textContent =

      `Prices shown in ${selectedCurrency}`;

    hideCountryScreen();

    renderProducts();

  });

document.getElementById("countryBtn")

  .addEventListener("click", showCountryScreen);

document.getElementById("cartBtn")

  .addEventListener("click", () => {

    renderCart();

    document.getElementById("cartOverlay").style.display = "flex";

  });

document.getElementById("closeProduct")

  .addEventListener("click", () => {

    document.getElementById("productOverlay").style.display = "none";

  });

document.getElementById("closeCart")

  .addEventListener("click", () => {

    document.getElementById("cartOverlay").style.display = "none";

  });

document.getElementById("addToCart")

  .addEventListener("click", addSelectedToCart);

document.getElementById("clearCart")

  .addEventListener("click", () => {

    cart = [];

    saveCart();

    updateCartButton();

    renderCart();

  });

document.getElementById("checkoutBtn")

  .addEventListener("click", () => {

    if (!cart.length) {

      alert("Your cart is empty 💕");

      return;

    }

    document.getElementById("cartOverlay").style.display = "none";

    document.getElementById("addressOverlay").style.display = "flex";

  });

document.getElementById("closeAddress")

  .addEventListener("click", () => {

    document.getElementById("addressOverlay").style.display = "none";

  });

document.getElementById("continuePayment")

  .addEventListener("click", async () => {

    const address = document

      .getElementById("addressInput")

      .value

      .trim();

    const message =

      document.getElementById("addressMessage");

    if (!address) {

      message.textContent =

        "Please enter your delivery address.";

      return;

    }

    const button =

      document.getElementById("continuePayment");

    button.disabled = true;

    button.textContent = "Opening secure payment... 💳";

    message.textContent = "";

    try {

      const response = await fetch(

        "https://squishymart.vercel.app/api/create-checkout-session",

        {

          method: "POST",

          headers: {

            "Content-Type": "application/json"

          },

          body: JSON.stringify({

            country: selectedCountry,

            address: address,

            cart: cart

          })

        }

      );

      const data = await response.json();

      if (!response.ok) {

        throw new Error(

          data.error || "Payment setup failed."

        );

      }

      if (!data.url) {

        throw new Error(

          "Stripe did not return a checkout link."

        );

      }

      window.location.href = data.url;

    } catch (error) {

      console.error(error);

      message.textContent =

        error.message ||

        "Something went wrong. Please try again.";

      button.disabled = false;

      button.textContent = "Continue to Payment 💳";

    }

  });

if (selectedCountry && selectedCurrency) {

  document.getElementById("countryScreen").style.display = "none";

  document.getElementById("currencyText").textContent =

    `Prices shown in ${selectedCurrency}`;

  renderProducts();

} else {

  showCountryScreen();

}

updateCartButton();

</script>

</body>

</html>
